# global_path_publisher 노드 파라미터.
#
# 이 값들은 원래 어디에도 파일로 없었다 -- scripts/global_path_publisher.py 의
# declare_parameter 기본값과 global_path.launch.py 의 DeclareLaunchArgument
# 기본값에만 있었고, 둘은 서로 같은 값을 두 번 적어 둔 상태였다. launch 를
# 쓰지 않는 기동 경로(kau_state_machine)가 같은 값을 세 번째로 베껴 적게 되어
# 파일로 뽑았다. launch 인자는 그대로 살아 있고, 주면 이 파일을 덮는다.
#
# 경로 데이터 자체(lane_graph.yaml)는 여기 있지 않다. `path` 는 파일 위치라
# 설치 트리마다 절대경로가 달라서, 그것만 부르는 쪽이 채운다:
#   launch  ->  lane:= 또는 path:= 인자
#   bringup ->  params 의 @kau_global_path:config/lane_graph.yaml
#
# 단위: 길이 m (KauPath 는 cm 지만 viz_spacing 은 nav_msgs/Path 용이라 m)

global_path_publisher:
  ros__parameters:

    # lane_graph.yaml 안의 routes 이름. 차로를 둘로 나눠 보지 않으므로
    # center_loop 다 (kau_global_path README 4.1.3). right_bias 같은 변형
    # 파일들도 레이어 이름이 center 라 이 값을 그대로 쓴다.
    route: "center_loop"

    topic: "/path/global"

    # ★ 0 으로 두지 말 것. latched 라 1 회 발행으로도 구독자는 받지만,
    #   kau_control 의 fallback_path_timeout 이 3 초라 정상 상태에서도
    #   그 뒤로는 만료된 것으로 본다. kau_gui 의 감시등도 STALE 로 뜬다.
    rate: 1.0

    # RViz 는 KauPath 를 못 그린다. 같은 곡선을 nav_msgs/Path 로도 낸다.
    viz_topic: "/viz/path/global"
    viz_spacing: 0.05               # m. global_avoidance.yaml 의 5.0 cm 와 같은 밀도

    # 1/m. 넘으면 경고만 내고 발행은 한다 (README 6.4). 차량 기하 최소회전반경
    # 기준값이라 global_avoidance.yaml 의 kappa_max_vehicle 과는 단위가 다르다.
    kappa_limit: 1.8199
