laser_scan_clusterer:
  ros__parameters:
    # use_sim_time 은 여기 두지 않는다. 이 파일에 박아 두면 실기에서 끌 방법이
    # 없다 (/clock 이 없어 now() 가 0 에 멈춘다). launch 인자나 -p 로 준다.
    input_topic: /scan_filtered
    expected_frame_id: lidar_link
    minimum_sample_count: 2
    sample_count_tolerance: 1
    require_intensities: false
    base_distance_threshold_m: 0.05
    angular_resolution_scale: 1.5
    circular_scan_tolerance_rad: 0.05
    # Neighbour/speckle filtering runs before clustering. A beam is kept when it
    # links to its immediate previous or next beam under the same adaptive
    # distance rule the clusterer uses, so a real two-beam cone survives and only
    # a beam with no reachable neighbour at all is dropped.
    speckle_filter_enabled: true
    # 1 keeps mutually supported two-beam candidates; 2 discards them again.
    minimum_support_neighbors: 1
    # Support radius relative to the clustering link threshold. At 1.0 a point
    # holding any clustering link can never be removed as speckle.
    neighbor_distance_scale: 1.0
    # Candidate acceptance only. Raw clustering no longer deletes small clusters,
    # so 1 lets a supported two-point cone reach the geometry stage.
    minimum_cluster_points: 1
    # Perpendicular distance in metres below which a point is treated as
    # collinear while building the observed footprint.
    collinear_tolerance_m: 0.001
    # Provisional circular occupancy candidate, derived read-only from the
    # measured cluster geometry. No safety inflation is applied here.
    # Half of the 0.18 x 0.18 m cone base footprint.
    nominal_cone_radius_m: 0.09
    # Radius of the cone cross-section visible at the 0.20 m LiDAR height. The
    # closest measured point is pushed away from the sensor by this amount to
    # recover a provisional cone axis centre.
    visible_slice_radius_m: 0.043
    # Largest observed extent that may still be a single cone. Deliberately
    # loose: 1.7x the full 0.18 m base diameter absorbs beam quantisation,
    # mounting-height error, and cone tilt, while still rejecting the multi-metre
    # wall clusters seen in the practice world by a wide margin.
    maximum_observed_width_m: 0.30
    log_cluster_geometry: true
    log_circle_candidates: true
    geometry_log_cluster_count: 3
    summary_period_seconds: 2.0
    # Read-only Gazebo Transport world pose diagnostics. Nothing in this package
    # transforms perception output with these values yet.
    world_pose_topic: /model/physicar/pose
    # Matched against the per-pose child_frame_id first, then the model name.
    # An empty value always takes the first entry of the message.
    world_pose_base_frame: base_footprint
    world_pose_timeout_s: 0.5
    # Planar part of the measured base_footprint -> lidar_link translation
    # [-0.027, 0, 0.200]. The rotation between the two frames is identity, and
    # the z offset does not affect the planar track ROI test.
    lidar_offset_x_m: -0.027
    lidar_offset_y_m: 0.0
    # Keep band around either track boundary. One cone radius (0.09) plus the
    # visible-slice correction (0.043) rounded up, so a cone standing on the
    # edge is never dropped because of centre-estimation error. The boundary
    # polygons themselves live in config/amet_2026_track.yaml.
    track_boundary_tolerance_m: 0.15
    # --- Object List output (kau_msgs/ObstacleCircleArray) ---------------------
    # Published for Local Path Planning. Circles carry the measured physical
    # obstacle only; vehicle size and safety margin stay with the planner.
    object_list_topic: /perception/obstacles
    # --- Raw diagnostic Object List twin -------------------------------------
    # Diagnostics only. Carries the candidates as they entered the tracker:
    # after the tf2 map transform, before association, outlier rejection and
    # EMA smoothing. Same header.stamp, frame_id and status as the frame on
    # object_list_topic, so raw and final can be compared frame by frame.
    # Local Path Planning must never subscribe to this topic.
    raw_diagnostic_object_list_topic: /perception/obstacles_raw_diagnostic
    # Set false to stop advertising the diagnostic topic. Nothing about the
    # published Object List changes either way.
    raw_diagnostic_object_list_enabled: true
    # --- RViz visualisation of the published Object List --------------------
    # visualization_msgs/MarkerArray built from the very message published on
    # object_list_topic, so the circles seen in RViz are the circles Local Path
    # Planning receives. Same QoS as the Object List. Visualisation only: no
    # consumer contract depends on this topic.
    obstacle_marker_topic: /perception/obstacle_markers
    # Set false to stop advertising the marker topic. Nothing about the
    # published Object List changes either way.
    obstacle_marker_enabled: true
    # Seconds a marker survives in RViz without being refreshed. The explicit
    # DELETE markers are the primary cleanup; this is the safety net for a node
    # that stops publishing altogether. Three publish periods at 10 Hz, so a
    # single dropped best-effort frame never makes the circles blink.
    obstacle_marker_lifetime_s: 0.3
    # Carried on every frame, failures included, so a consumer never has to
    # branch on the status to know which frame the message speaks about.
    object_list_frame_id: map
    # v1 approves candidates in a binary way, so every published circle is 1.0.
    object_list_confidence: 1.0
    # Freshness the Object List demands of the world pose. Deliberately stricter
    # than world_pose_timeout_s: the ROI stage may still trust a 0.4 s old pose
    # and fail open, but a frame that old must not be published as STATUS_OK.
    object_list_pose_timeout_s: 0.3
    # No usable scan for this long makes the node report STATUS_LIDAR_UNAVAILABLE.
    object_list_scan_timeout_s: 0.3
    # Watchdog tick. Node clock, so it follows simulation time.
    object_list_watchdog_period_s: 0.1
    # Republication period while the watchdog holds. Must stay below
    # object_list_scan_timeout_s so a consumer sees the state inside its own
    # 0.3 s discard window without being spammed at the full tick rate.
    object_list_watchdog_publish_period_s: 0.2
    # --- Temporal tracking of the map-frame circle candidates ----------------
    # Runs after the track ROI stage on candidates that already carry a valid
    # map centre. It only stabilises the published centre; radius, confidence,
    # status handling and the raw candidate pipeline are untouched. No pose /
    # LiDAR time synchronisation is performed at this stage.
    temporal_tracking_enabled: true
    # Metres. Largest map-frame distance at which this frame's candidate is
    # accepted as the same obstacle as an existing track. Sized above the
    # measured high-speed P95 position error (0.193 m) so a fast lap keeps its
    # tracks, and far below the smallest cone-to-cone spacing on the track so
    # two obstacles never collapse into one track.
    association_distance_m: 0.30
    # Metres. Applied after association, against the previous smoothed estimate.
    # A linked candidate farther away than this is a momentary outlier and is
    # dropped from the update instead of being averaged in. Sized just above the
    # high-speed P95 error so a genuine fast-lap measurement still counts, while
    # the 0.20-0.30 m band that association still admits is treated as a jump.
    # Deliberately smaller than association_distance_m: the two gates answer
    # different questions and are evaluated in separate stages.
    outlier_distance_m: 0.20
    # Weight of the newest measurement in the exponential moving average:
    # estimate = alpha * measurement + (1 - alpha) * previous_estimate.
    # 0.2 halves the small frame-to-frame jitter within roughly four frames at
    # the 10 Hz publish rate: smoother than 0.4, and slower to follow a real
    # correction.
    smoothing_alpha: 0.2
    # Consecutive accepted observations a new track needs before it may be
    # published. 2 costs one extra frame (about 0.1 s at 10 Hz) and removes the
    # single-frame ghost candidate.
    minimum_confirmation_frames: 2
    # Seconds a track survives without an accepted observation before it is
    # deleted. About seven frames at 10 Hz, so a short occlusion keeps the track
    # identity. A track that is not observed in the current frame is still never
    # published: this only governs the internal store.
    track_timeout_s: 0.7
