# backup_path_planner
#
# 경로 생성 단독 소유. 거리는 전부 후륜축 원점 기준 [m], 좌측 +.
# 타이머가 아니라 lane 콜백으로 돈다 -- 차선이 끊기면 경로도 끊겨
# speed_controller 의 timeout 게이트가 자동으로 작동한다.

/**:
  ros__parameters:

    # ================================================================
    # 입출력
    # ================================================================
    lane_topic: "/backup/lane/geometry"
    obstacle_topic: "/backup/perception/obstacles"
    speed_topic: "/speed"
    steer_topic: "/steering"
    output_topic: "/backup/path"

    # 타이머를 쓰지 않는다. 0 이면 lane 콜백 구동.
    # 0 보다 크면 그 주기 타이머로 도는데, 12 Hz 입력과 비팅하고
    # 차선이 끊겨도 낡은 경로를 계속 재발행해 고장을 감춘다.
    timer_hz: 0.0

    lane_timeout_s: 0.4

    # ================================================================
    # 차량 제원
    # ================================================================
    wheelbase_m: 0.18
    vehicle_width_m: 0.205
    vehicle_length_m: 0.280
    rear_axle_to_front_bumper_m: 0.230
    max_steer_deg: 20.0               # 하드웨어 한계. R_min = 0.18/tan(20) = 0.4945 m

    # ================================================================
    # 트랙
    # ================================================================
    track_width_m: 0.700              # world.json 실측 (코너에서 최대 0.85)
    lane_margin_m: 0.05               # 편측. 차선 이탈은 실격이다

    # ================================================================
    # 모션 보상 -- 지터 최대 원인 대책
    # ================================================================
    # 차선 기하 stamp 부터 이번 계획 시각까지 자차 이동을 적분해
    # 현재 base_link 로 옮긴다. 안 하면 12 Hz 톱니파가 조향에 실린다.
    use_dead_reckoning: true
    max_dead_reckon_s: 0.30           # 이보다 오래된 데이터는 버린다

    # ================================================================
    # 레이스 라인
    # ================================================================
    # R = min( W/(1-cos(dpsi/2)), (d_sight - v*t_lat)/tan(dpsi/2) )
    # W  = track_width - 선회소요폭(R) - 2*lane_margin
    # 선회소요폭 = hypot(R + 폭/2, 후륜축->앞범퍼) - (R - 폭/2)
    enable_race_line: true
    d_sight_m: 1.60                   # 신뢰 검출거리. 실측으로 확정 (설계문서 16-3)
    t_lat_s: 0.10                     # 모션 보상 적용 기준
    race_line_r_max_m: 5.0            # dpsi 가 작을 때 R_sight 발산 방지
    width_iterations: 2               # 선회소요폭이 R 에 의존하므로 반복

    # ================================================================
    # 회피 -- 중앙선 횡방향 offset
    # ================================================================
    obstacle_radius_m: 0.142          # 모든 장애물을 이 원으로 본다
    avoid_clearance_m: 0.10           # 장애물 표면 <-> 차체
    avoid_trigger_m: 1.40             # 이 거리 안의 장애물만 본다
    avoid_lateral_gate_m: 0.30        # 경로에서 이만큼 벗어난 장애물은 무시

    # offset = |y_obs| - r_obs - 폭/2 - clearance, 부호는 장애물 반대편.
    # 실측 기준: 콘이 중앙선에서 0.18 m -> offset 0.164 m,
    # 이때 차선 여유 0.083 m 가 남는다.
    avoid_offset_rate_m_per_s: 0.60   # 레이트 리밋. 계단 offset 금지

    # ================================================================
    # 경로 표현 -- quintic Bezier
    # ================================================================
    # P0 는 항상 후륜축 원점, P1 은 진행방향 접선으로 고정한다.
    # 모드가 바뀌어도 자차 근처 경로가 안 움직이게 하는 구조적 제약이다.
    degree: 5
    anchor_at_vehicle: true
    # P1 = P0 + h * (1, 0). h 는 이 값을 하한으로 하되 실제로는 더 크게 잡는다.
    # quintic 의 시작 곡률이 kappa(0) = 0.8 * d_perp / h^2 이라 h=0.05 를 그대로 쓰면
    # P2 의 횡오차 6 mm 만 넘어도 20 deg 를 초과한다 (검산으로 확인).
    # 레이스 라인은 h = sqrt(0.8*d_perp*R), 중앙선은 h = 경로길이/5 (균일 배치).
    tangent_epsilon_m: 0.05
    zero_end_curvature: true          # 끝 곡률 0 -> 다음 구간과 G2

    # ================================================================
    # 안정화
    # ================================================================
    # 제어점이 아니라 생성 파라미터에 필터를 건다.
    param_ema_alpha: 0.5
    source_min_hold_s: 0.3            # 모드 전환 최소 유지시간

    # ================================================================
    # 로그
    # ================================================================
    # kappa_saturated 가 선 구간의 s 위치/지속시간/최대 요구 delta 를
    # 남긴다. 이 로그가 곧 "실제 통과 가능 여부" 의 답이다.
    log_kappa_saturation: true
    log_period_s: 2.0
