# ============================================================
# KAU Lane Detection - Parameters
#
# ros2 param set 으로 실시간 변경도 되지만, 확정된 값은
# 여기에 적어두면 launch 할 때마다 자동 적용된다.
# ============================================================

kau_lane_detection_node:
  ros__parameters:

    # --------------------------------------------------------
    # BEV 원근변환
    #
    # src 사다리꼴의 윗변 폭은 소실점에서 자동 계산되므로,
    # top_y / bottom_y 를 바꿔도 차선은 평행하게 유지된다.
    # --------------------------------------------------------

    bev_src_center_x: 240.0       # src 사다리꼴 중심 x
    # 윗변 y.
    #
    # 올릴수록 가까이만 보는 대신 BEV 가 선명해진다.
    # 윗변 폭은 소실점에서 역산되므로 top_y 를 올리면 윗변이
    # 넓어져 원거리 확대배율이 떨어진다:
    #
    #   top_y  윗변폭  세로배율  위쪽가로배율  BEV세로
    #    195    84px    4.80x      2.84x      169cm
    #    205   137px    5.54x      1.75x       90cm
    #    210   164px    6.00x      1.47x       70cm
    #
    # 실패 77장 실측 (undist 원본에서 다시 warp).
    # ★ 아래 표는 전부 bev_out 480x360 시절 값이다:
    #   top_y  노란선OK  Y스텝합  L+R OK  LR스텝합  경로길이  검정%
    #    195     56       469     129     1432      85cm    5.2
    #    200     61       578     123     1587      90cm    7.4
    #    205     63       683     110     1619      89cm    9.9
    #    210     66       790     107     1596      84cm   12.8
    #    215     66       788     109     1615      67cm   16.2
    #
    # BEV 세로 범위가 169 -> 70cm 로 줄어드는데 경로 길이는
    # 85 -> 84cm 로 거의 그대로다. 195 에서도 근거가 실제로
    # 닿는 거리는 85cm 뿐이었고 나머지는 외삽이었다는 뜻이다.
    #
    # 대신 흰선 검출은 129 -> 107 로 17% 준다 (하단 모서리
    # 검은 영역이 5.2 -> 12.8% 로 커지면서 연석을 먹는다).
    # 흰선을 아끼려면 200~205 가 균형점이다 — 그래서 한동안
    # 205 였다.
    #
    # ★ 그 결론은 폐기되었다. 위 표의 "top_y 를 내리면 원거리가
    #   뭉개진다" 는 손실은 BEV 출력 캔버스가 480x360 으로
    #   묶여 있던 데서 온 것이고, 640x480 으로 키우면 195 에서
    #   흰선/노란선 창이 오히려 늘어난다. 아래 참조.
    #
    # 차선 간격(lane_width_px)은 하단 변이 정하므로 이 값과 무관하다.
    # 205.0 -> 195.0 (640x480 과 한 세트).
    #
    # 위 표의 근거로 되돌린 값이다. 205 를 골랐던 이유는
    # "top_y 를 내리면 원거리 점선이 뭉개져 검출률이 떨어진다"
    # 였는데, 그 손실은 BEV 출력 해상도가 480x360 으로 고정된
    # 탓이었다. 640x480 에서는 195 로 내려도 흰선/노란선 창이
    # 오히려 늘고(40.0 -> 48.6) 유효 길이가 143 -> 168 cm 가 된다.
    #
    # 188 까지 더 내리면 190 cm 를 넘지만 len 이 90~297 cm 로
    # 요동친다 (닿는 거리보다 외삽 구간이 길어진다). 195 가
    # 변동이 작은 쪽이다.
    #
    # bev_vanishing_y(179.0) 보다 반드시 위여야 한다 — 195 는
    # 여유 16 px.
    # 2026-08-25 재유도 (fx 201.4 -> 261.559, 카메라 2도 하향 틸트).
    # 옛 광학에서 튜닝된 지면 영역 32.3~184.3 cm 를 그대로 되찾는 행.
    bev_src_top_y: 190.32
    bev_src_bottom_y: 286.10      # 아랫변 y (좌/우 흰선이 화면에 들어오는 상한)
    bev_src_bottom_width: 480.0   # 아랫변 폭

    # 소실점 y. BEV 위쪽이 아래보다 좁으면 올리고, 넓으면 내린다.
    # 179.0 = live undistort 프레임 직접 스윕으로 위/아래 간격이
    # 일치한 값 (위 194.9 / 아래 195.4).
    # cy(180.0) + fy(261.559)*tan(-2.284deg) = 169.57
    #   -2.284deg = 카메라 2도 하향 + 기존 실측편차 -0.284deg
    #   ★ 2도 하향은 /camera/tilt 로 직접 세워야 한다 (노드가 명령하지
    #     않는다 — §12 "tilt 미구현"). 안 세우면 지평선이 9px 어긋난다.
    bev_vanishing_y: 169.57

    # dst 좌우 여백 비율. 클수록 차선이 가운데로 모인다.
    # 0.25 -> 좌/우 흰선이 약 129px, 351px
    bev_dst_margin_ratio: 0.25

    # 480x360 -> 640x480 (가로/세로 모두 4/3배).
    #
    # 축척만 바꾸는 값이지 look-ahead 를 바꾸는 값이 아니다.
    # top_y 를 고정한 채 해상도만 키우면 검출 거리는 그대로다
    # (실측 77.3 -> 78.4 cm). 대신 같은 지면이 더 많은 BEV
    # 픽셀로 펴져서, warpPerspective 의 INTER_CUBIC 보간이
    # 원거리 마킹 가장자리 색을 덜 뭉개고 HLS 임계를 통과하는
    # 픽셀이 늘어난다. 그래서 top_y 를 **내렸을 때** 손실을
    # 되돌려 준다:
    #
    #   out       top_y   len(경로 유효길이)
    #   480x360    205      77.4 cm   (이전 설정)
    #   480x360    195     143.3 cm
    #   640x480    195     168   cm   <- 현재 설정
    #   480x360    188     177.9 cm
    #   640x480    188     190.5 cm   (len 90~297 로 크게 흔들림)
    #
    # 비용은 프레임당 9.9 -> 14.8 ms (+52%), %CPU 14.5 -> 22.1.
    # 14.86 Hz 유지, 드롭 0. 68 ms 예산에는 여유가 있으나
    # Pi 5 는 코어당 더 느리므로 30 ms 안팎을 예상할 것.
    #
    # 가로/세로를 같은 배수로 키워야 sx/sy 비등방이 보존된다
    # (sx 는 bev_out_width, sy 는 bev_out_height 만 따라간다).
    # lane_width_px 는 sx 에서 유도되므로 자동 추종한다.
    # 반면 window_margin / min_pixels / track_step_px 는
    # px 절대값이라 아래에서 손으로 비례 조정했다.
    # 640 -> 500. 화각이 104->85deg 로 좁아져 같은 거리의 횡방향 지면을
    # 23% 덜 본다. 캔버스 폭을 같은 비율로 줄여야 sx(0.1207)/비등방(2.62)/
    # lane_width_px(258.8) 가 보존되고 window_margin/min_pixels/
    # track_step_px 를 손대지 않아도 된다 (§3).
    bev_out_width: 500
    bev_out_height: 480

    # --------------------------------------------------------
    # HLS 색 임계 [H, L, S]
    #
    # OpenCV BGR2HLS 규약: H 0~179, L/S 0~255.
    #
    # ★ 중앙선은 노랑이 아니라 **주황**이다 (실차 확인, 2026-08-25).
    #   파라미터 이름만 yellow_* 로 남아 있다.
    #
    # live BEV 실측:
    #   잔디        H 31~32, L 118~137, S 37~91
    #   주황 중앙선 H 18,    L 110,     S 225
    #
    # ★ 잔디를 거르는 것은 **H** 다 (S 가 아니다).
    #
    #   예전에는 H 범위가 15~35 라 잔디 H 31~32 를 포함했고,
    #   그래서 잔디를 막는 것이 S 하한 하나뿐이었다 — 70 이면
    #   잔디가 통과해 peak 이 중앙선(239)이 아니라 왼쪽 잔디(117)
    #   에 꽂혔고, 150 이어야 잔디(<=91)와 중앙선(225)이 갈렸다.
    #
    #   지금은 H 상한이 20 이라 잔디가 색상에서 이미 탈락한다
    #   (31~32 vs 20, 마진 11). S 하한 100 은 잔디 방어선이 아니라
    #   그늘에서 어두워진 주황선을 살리기 위한 값이다.
    #
    # ★ 흰색 S 상한이 70 -> 255 로 풀려 있다. 원래 흰선을 중앙선과
    #   가르던 조건이 "채도가 낮다(S<=70)" 였는데 그게 없어져서
    #   지금은 L >= 205 하나만 남았다. 주황선 L 이 110 이라 당장은
    #   안 새지만, 실차 조명에서 주황선 L 이 205 를 넘으면 중앙선이
    #   흰선 마스크로 들어온다 (좌/우 흰선 판정이 통째로 어긋난다).
    #   실차에서 흰선 마스크에 중앙선이 보이면 여기를 먼저 볼 것.
    #
    # ★ 배열 순서는 [H, L, S] 다. H 는 0~179 범위이므로 첫 칸에
    #   190~210 같은 값을 넣으면 마스크가 통째로 비어 검출이 0 이
    #   된다. 흰선 밝기 하한(190~210)은 **두 번째 칸(L)** 이고,
    #   현재 205 로 이미 그 범위 안이다.
    # --------------------------------------------------------

    yellow_hls_lo: [0, 80, 100]
    yellow_hls_hi: [20, 255, 255]
    white_hls_lo: [0, 205, 0]
    white_hls_hi: [180, 255, 255]

    # --------------------------------------------------------
    # Sliding Window
    # --------------------------------------------------------

    # 곡선 추종의 지배적 파라미터.
    # 창 높이 40px 기준 창당 차선 횡이동:
    #   곡률 140px -> 27.7px / 180px -> 35.6px / 220px -> 43.5px
    # 상한은 차선 간격(105px)의 절반인 52px.
    #
    # ★ 위 수치는 전부 bev_out 480x360 기준이다. 640x480 으로
    #   키우면서 4/3 배로 비례 조정했다 (40 -> 53). 안 올리면
    #   창이 상대적으로 좁아진 셈이라 곡선에서 차선을 놓친다.
    window_margin: 53

    # 창 판정 최소 픽셀 수.
    # 곡선에서 자꾸 놓치면 내리고, 노이즈에 끌리면 올린다.
    #
    # ★ 이건 길이가 아니라 **면적**이라 4/3 이 아니라 (4/3)^2
    #   = 1.78 배다. 창은 진행방향 track_step_px, 횡으로
    #   2*window_margin 이고 둘 다 4/3 배가 되었으므로
    #   20 * 16/9 = 35.6 -> 36.
    #
    # ★ 이 값은 생성자에서 한 번만 읽는다. ros2 param set 으로
    #   런타임 변경이 안 되므로 바꾸려면 노드를 재시작할 것.
    min_pixels: 36

    # --------------------------------------------------------
    # 방향성 추적 (90도 코너 대응)
    #
    # 창이 y 격자에 묶여 위로만 올라가면, 차선이 가로로 누운
    # 구간에서는 원리상 이어질 수 없다. 창을 진행 방향으로
    # 회전시켜 차선을 따라 돌아간다.
    #
    # 실패 프레임 73장 실측 (노란선 주성분 방향):
    #   가로에 가까움(<45도) 59장 / <20도 18장
    #   y 밴드 3개 이하에 갇힘 33장
    # --------------------------------------------------------

    # 한 스텝 전진 거리 [BEV px].
    #
    # 코너 추종을 지배하는 값. 창이 진행방향 step, 횡으로
    # 2*margin 이라 한 스텝에서 흡수 가능한 방향 변화가
    # 대략 atan(margin/step) 이다.
    #   step 40 -> 45도 / 25 -> 58도 / 20 -> 63도
    #
    # 실패 77장 + 라이브 실측:
    #   step  노란선3스텝↑  경로생성  잔차중앙   90%    최대
    #    40      40장       65/77     7.1px   12.9   20.4
    #    25      55장       75/77     9.7px   15.7   21.0
    #    20      59장       77/77    10.8px   17.4   31.9
    #
    # ★ 위 표도 bev_out 480x360 기준 px 이다. 640x480 에서는
    #   4/3 배인 33.0 이 같은 물리 거리에 해당한다. sx 가 0.75배
    #   가 되므로 track_max_steps(48) 와 곱한 물리 도달거리도
    #   그대로 보존된다 (48*33*0.75 ≈ 48*25).
    #
    # ★ min_pixels 와 마찬가지로 생성자에서만 읽는다.
    #   런타임 변경 불가 — 재시작 필요.
    track_step_px: 33.0

    # 한 스텝에서 허용하는 최대 방향 변화 [deg].
    # 키우면 노이즈를 물었을 때 창이 되꺾인다.
    track_max_turn_deg: 30.0

    # 최대 스텝 수. step 33px(640x480) 이면 직선 BEV 통과에
    # 14스텝으로, 480x360 시절 step 25px 과 같은 물리 거리다.
    track_max_steps: 48

    # 연속으로 비어도 관성 주행할 스텝 수 (점선 공백 대비).
    # step * miss = 132px (640x480) 정도가 코스팅 거리 —
    # 480x360 시절 100px 과 같은 지면 거리다.
    track_max_miss: 4

    # 흰선 쪽 판정 [lane_width_px 비율].
    #
    # 흰선 base 는 x 구간 히스토그램으로 찾는다. 차선이 세로로
    # 서 있을 때만 "x 로 왼쪽" = "차로의 왼쪽" 이다. 90도 코너에서
    # 차선이 가로로 누우면 좌/우 흰선이 노란선의 위/아래에 쌓여
    # x 구간이 반대쪽 선이나 같은 선을 물어 온다.
    #
    # 추적 후 노란선 기준으로 재보고 반대쪽이면 버린다.
    # 실패 프레임(노란선 추적 성공 55장) 실측:
    #             L엉뚱  R엉뚱  같은선   L성공  R성공
    #   검증 없음    11     5      8      40     48
    #   부호 검증     0     0      0      29     43
    lane_side_min_ratio: 0.40

    # 흰선 회랑 [lane_width 비율].
    #
    # 흰 마스크에는 차선만 있지 않다. 체커보드 연석, 정지선,
    # 급커브에서 보이는 트랙 다른 구간의 차선까지 들어오고,
    # 방향성 창은 그것들을 구분하지 못하고 갈아탄다.
    #
    # 차로 폭은 고정이므로 노란선에서 그만큼 떨어져 있지 않은
    # 점은 우리 차로의 흰선이 아니다. 이탈한 지점에서 자른다.
    #
    # 실패 프레임 63장 실측:
    #   흰선 검출 L34/R53 중 이탈 L7/R3
    #   추적점 1309개 중 68개(5%)만 절단, 3점 미만이 된 건 2건
    #   그 프레임들에서 중심선이 최대 117cm 달라졌다
    lane_corridor_lo: 0.60
    lane_corridor_hi: 1.40

    # 중심선 후보 이탈 판정 [lane_width_px 비율].
    #
    # 세 차선이 각각 중심선 후보를 하나씩 내놓는다. 하나가 엉뚱한
    # 선을 물면(노란선 소실 시 좌/우가 같은 흰선을 무는 경우)
    # 가중평균이 통째로 끌려간다.
    #
    # 실패 65장 실측 (중심선 적합 잔차):
    #   제거 없음        중앙 10.4px  90%ile 77.1px  최대 105.5px
    #   0.30W 이상 제거  중앙  7.1px  90%ile 12.9px  최대  20.4px
    #   0.50W 이상 제거  중앙  8.5px  90%ile 16.0px  최대  32.3px
    center_outlier_ratio: 0.30

    # (lane_width_px 는 파라미터가 아니다)
    #
    # px 는 BEV 설정이 바뀌면 같이 변하는 내부 단위라 다른
    # 패키지와 맞출 수 없고, 실제와 어긋나도 겉으로 드러나지
    # 않는다.
    #
    # 이제 아래 두 물리량에서 유도한다:
    #
    #   lane_width_px = lane_width_cm / sx
    #   sx            = camera_height_cm 과 intrinsic 에서 유도
    #
    # 기동 로그의 "차로 폭 유도" 줄에 결과가 찍히고,
    # 직선 구간 프레임에서 실측과 15% 이상 벌어지면 경고가 나온다.
    # (곡선에서는 폴리라인 현 근사 때문에 실측이 부풀려져
    #  비교하지 않는다)

    # 히스토그램 밴드 높이 [BEV 하단 비율].
    #
    # 슬라이딩 윈도우 시작점을 찾는 밴드. 예전 값은 0.40 이었다.
    # 곡선에서 BEV 차선은 기울어져 있어서, 밴드가 세로로 길면
    # 그 안에서 차선이 옆으로 쓸려 peak 가 뭉개진다.
    #
    # 실패 70장 실측 (peak 오차):
    #   밴드   중앙  90%ile   최대   다른차선을잡음
    #   0.40     14    157    325       9장
    #   0.10      4     34     65       0장
    #
    # 비면 2배 -> 4배로 넓혀 재시도한다 (점선 공백 대비).
    histogram_band_ratio: 0.10

    # --------------------------------------------------------
    # Debug
    # --------------------------------------------------------

    # /kau_lane_detection/bev_roi 에 src 사다리꼴을 그려서 발행.
    # 사다리꼴 좌/우 변이 실제 차선과 나란한지 확인용.
    publish_roi_overlay: true

    # --------------------------------------------------------
    # 경로 발행 (docs/경로_형식.md)
    #
    # 이 노드의 최종 산출물은 중심선의 quintic Bezier 제어점 6개다.
    # 이산 좌표는 만들지도 싣지도 않는다 (대전제).
    # --------------------------------------------------------

    publish_path: true

    # 제어점 좌표계. X 전방 / Y 좌 / 단위 cm.
    #
    # "map" (기본값) 이면 발행 직전에 map <- base_link TF 로 제어점을
    # 옮긴다 — 측위(Cartographer/AMCL)가 떠 있어야 발행이 나간다.
    # 측위 없이 검증할 때는 "base_link" 로 바꿔 변환 없이 낸다.
    # 2026-08-25: map 의존 제거. 측위(AMCL/Cartographer)가 없으면
    # lookupTransform 이 실패해 "map 변환 실패로 이번 프레임은 발행하지
    # 않습니다" 로 /lane/center 가 통째로 끊기고, 같은 실패가 pan 트리거
    # 판정까지 건너뛰게 만든다 (§1/§12). 대회장 노이즈로 절대측위를
    # 신뢰할 수 없으므로 base_link 로 발행한다.
    path_frame_id: "base_link"

    # ★ 카메라 높이 [cm] — 축척의 유일한 기준. 반드시 실측할 것.
    #
    # 지면부터 렌즈 중심까지. 이 값 하나에서
    # BEV 가로/세로 축척, 경로 X 원점, lane_width_px 가 전부 나온다.
    # 틀리면 발행되는 모든 좌표가 같은 비율로 틀어진다.
    #
    # 14.65 는 시뮬레이터 모델 model.sdf 의 포즈 체인 합:
    #   camera_pan_joint  rel base_footprint  z 0.1195
    #   camera_tilt_joint rel camera_pan_link z 0.0130
    #   camera_sensor     rel camera_tilt_link z 0.0140
    #                                    합계   0.1465 m
    #   base_footprint 는 지면 (바퀴축 z 0.0375 = 바퀴 반지름)
    #
    # 검증: 직선 구간 한 프레임을 undistort 해 지면으로
    # 역투영하고, 맵 mesh 실측 치수로 h 를 역산하면
    #   도로 바깥 가장자리 간격  70.0 cm -> h 14.552
    #   흰선 안쪽 가장자리 간격  55.0 cm -> h 14.670
    #   중앙선 <-> 왼쪽 흰선 안쪽 27.5 cm -> h 14.708
    #   중앙선 <-> 오른쪽 흰선 안쪽 27.5 cm -> h 14.633
    # 네 경로가 모두 14.6 근처로 모인다.
    camera_height_cm: 14.65

    # --------------------------------------------------------
    # 차선 정보 — 도로 모형
    #
    # 차로 폭 하나만으로는 "차로가 몇 cm 인가" 밖에 모른다.
    # 선이 하나만 보일 때 그것이 어느 선인지 고르려면 도로
    # 단면이 먼저 있어야 한다 (identifyLine).
    #
    # 차로 번호 개념은 없앴다. 자차가 중앙선 어느 쪽 차로에
    # 있든 상관하지 않고 중앙선(황색 점선)만 추종한다. 그래서
    # 예전의 road_lane_count / drive_on_right / ego_lane_* 는
    # 노드가 더 이상 선언하지 않는다 (여기서도 제거했다).
    #
    # 이 맵(custom_71e69...dae)의 실측 단면 (x = 6.0 m, 단위 m):
    #
    #   road   y 0.8805 .. 1.5805   아스팔트 폭 0.700
    #   ol     y 0.8805 .. 0.9555   흰 실선   폭 0.075
    #   cl     y 1.2180 .. 1.2430   황색 점선 폭 0.025
    #   il     y 1.5055 .. 1.5805   흰 실선   폭 0.075
    #
    #   중앙선 중심 <-> 흰선 중심 0.3125 m  (= 차로 폭)
    #   흰선 중심   <-> 흰선 중심 0.6250 m  (= 도로 폭)
    #
    # 도로는 닫힌 고리다. 같은 x = 6.0 평면이 도로를 두 번
    # 지나는데 두 통과의 선 순서가 뒤집혀 있다:
    #   아래쪽 통과  ol 0.9180 -> cl 1.2305 -> il 1.5430
    #   위쪽 통과    il 4.2988 -> cl        -> ol 4.9590
    # il 이 양쪽에서 안쪽을 향한다. 즉 ol 이 바깥 경계,
    # il 이 안쪽 경계인 무한 루프 2차선이다.
    #
    # 흰선은 차선 경계가 아니라 도로의 양 경계이고, 유일한
    # 내부 경계가 황색 점선 중앙선이다. 두 흰선 중 어느 쪽이
    # 트랙 바깥 경계인지는 도는 방향에 달렸으므로, 검출은
    # 차량 기준 좌/우만 쓴다.
    #
    # ★ 선언 자체는 코드에 있다:
    #   include/kau_lane_detection/road_map.hpp  (namespace kau_road)
    #
    #   LANE_COUNT / LANE_WIDTH_CM / ROAD_WIDTH_CM
    #   LINES[] = { -31.25 흰선, 0.00 황색, +31.25 흰선 }
    #
    # 선이 하나만 보일 때 그것이 왼쪽 가장자리인지 오른쪽
    # 가장자리인지는 관측만으로는 알 수 없다. 그 판정에 이
    # 단면 선언이 쓰인다 (identifyLine). 맵을 바꾸면 그 파일을
    # 고칠 것. 아래 파라미터는 전역 선언을 기본값으로 받는다.
    # --------------------------------------------------------

    # ★ 실 차로 폭 [cm] — 노란 중앙선 중심 <-> 흰 차선 중심.
    #
    # 축척에는 쓰이지 않는다 (축척은 camera_height_cm 이 정한다).
    # lane_width_px 로 환산되어 흰선 히스토그램 탐색 밴드,
    # 좌/우 판정, 회랑 절단, 한쪽 소실 복원, 그리고 자차 차로
    # 판정의 기준이 된다.
    #
    # 31.25 는 위 mesh 실측값이다.
    # 영상 검증: 직선 프레임 BEV 에서 흰선 사이 195.0 px,
    # sx 0.3220 cm/px -> 62.79 cm. mesh 62.50 과 0.5% 차이.
    #
    # (이전에 35.0 이 들어 있었다. 곡선이 섞인 주행 로그에서
    #  흰선-노란선 간격 중앙값 108.3 px 를 참값으로 본 결과인데,
    #  그 실측은 노란선 폴리라인의 현에 투영해 재는 방식이라
    #  곡선 바깥쪽에서 부풀려진다. 직선에서 다시 재면 97.5 px.)
    #
    # camera_height_cm 14.65 기준으로 31.25 cm = 97.1 BEV px.
    lane_width_cm: 31.25

    # 중앙선 대비 자차 횡거리의 근거(노란선 실측 또는 흰선
    # 두 개)가 끊겨도 직전 판정을 유지할 프레임 수. 점선
    # 공백과 순간 가림 대응. 14 Hz 이므로 10 프레임 = 0.7 초.
    #
    # (ego_lane_hold_frames 의 후신이다. 차로 번호 판정이
    #  없어지면서 남은 것은 이 스칼라 하나뿐이다.)
    center_hold_frames: 10

    # 카메라 접지점 -> path frame 원점 보정 [cm].
    #
    # camera_height_cm 이 들어가면 경로 X 원점은 카메라 접지점이다.
    # base_link 가 그보다 뒤에 있으면 그 거리를 여기 넣는다.
    # 시뮬레이터 모델: 카메라는 base_footprint 앞 10.5 cm
    # (0.050 + 0.025 + 0.030 m) -> path_x_offset_cm: 10.5
    path_x_offset_cm: 10.5
    path_y_offset_cm: 0.0

    # 발행한 Bezier 를 debug_image 위에 되돌려 그린다 (마젠타).
    draw_path_overlay: true

    # --------------------------------------------------------
    # 발행 게이트
    #
    # 경로를 만드는 것과 발행하는 것은 다른 문제다. 근거가
    # 모자라거나 물리적으로 못 도는 경로는 만들어 놓고도
    # 발행하지 않는다 (debug_image 에는 붉은 회색으로 그려서
    # 무엇이 막혔는지 눈으로 보이게 한다).
    #
    # 여태 yaml 에 없어서 코드 기본값으로만 돌던 값들이다.
    # 값은 코드 기본값과 같으므로 동작은 바뀌지 않는다.
    # --------------------------------------------------------

    path_gate_enable: true

    # 중심선이 딛고 선 실측 창 수 하한.
    min_path_windows: 6

    # 차량 제원. 최소 회전반경 = wheelbase / tan(max_steer).
    # kau_control 의 path_follower.yaml 과 같은 값이어야 한다.
    wheelbase_cm: 18.0
    max_steer_deg: 20.0

    # 경로가 벗어나면 안 되는 횡방향 한계 [cm].
    # 0 이면 BEV 영상 폭 절반으로 자동 설정한다.
    max_lateral_cm: 0.0

    # --------------------------------------------------------
    # 시간축 강건화 (EMA)
    #
    # 발행 게이트는 프레임 하나만 보고 통과/기각을 정한다.
    # 임계값을 조이면 멀쩡한 차선이 떨어져 나가고, 풀면 도로 밖
    # 노란 물체(원경의 그림 등)가 통과한다. 어느 쪽이든 하류
    # state machine 의 fail-safe 판정이 흔들린다. 프레임 하나로는
    # 못 정하는 문제라 시간축을 쓴다.
    #
    #   1. 게이트를 통과한 관측을 EMA 추정치에 섞되, 섞는 양을
    #      그 프레임의 confidence 에 비례시킨다. 믿기 힘든
    #      프레임은 추정치를 조금밖에 못 움직인다.
    #
    #   2. 추정치에서 크게 벗어난 관측은 아예 안 섞고, 직전
    #      추정치를 그대로 내보내면서 confidence 만 떨어뜨린다.
    #      하류는 "경로는 계속 오는데 신뢰도가 미끄러진다" 를
    #      보고 스스로 판단할 수 있다.
    #
    #   3. 같은 주장이 연속으로 오면 실제 변화로 보고 재잠금.
    #      (없으면 진짜 차선 변화에 영원히 눈감는다)
    #
    # ★ 자기운동 보정은 없다. 이 노드는 측위 비의존이 대전제라
    #   odom/TF 를 볼 수 없다. 차선을 따라가는 동안 base_link
    #   기준 경로는 거의 불변이라 편향이 작지만, 속도가 붙으면
    #   추정치가 뒤로 끌리는 지연이 생긴다. alpha 를 올리면
    #   지연이 줄고 강건성이 준다.
    # --------------------------------------------------------

    path_ema_enable: true

    # confidence = 1 인 프레임의 혼합 비율.
    # 0.4 면 시상수가 약 2 프레임 (14 Hz 에서 0.15 s).
    path_ema_alpha: 0.4

    # 추정치가 한 프레임에 움직일 수 있는 최대 속도 [cm/s].
    # 실제 상한은 이 값 x dt 라 프레임이 느려지면 같이 넓어진다
    # (path_ema_gate_cm 과 단위가 다른 이유. CLAUDE.md 7).
    path_max_step_cm_per_s: 80.0

    # 관측이 추정치에서 이만큼(제어점 6개의 평균거리) 벗어나면
    # 섞지 않는다. 차로 폭 31.25 의 절반쯤.
    #
    # ★ 실측으로 잡을 것. status 의 edev 가 매 프레임의 실제
    #   편차다. 정상 주행에서 나오는 값보다 넉넉히 위, 원경
    #   물체를 물었을 때 나오는 값보다는 아래로 둔다.
    #   0 이하면 게이트 없이 순수 EMA.
    # **공칭 14 Hz 기준값**이다. 프레임이 느려지면 dt 에 비례해
    # 넓혀서 쓴다.
    #
    # 왜 필요한가 — EMA 의 두 안전장치는 단위가 달랐다:
    #   이동 상한   path_max_step_cm_per_s * dt   [속도]  자동 조정됨
    #   이상치 게이트 path_ema_gate_cm             [절대]  고정
    #
    # 14 Hz 에서 15 cm/프레임은 210 cm/s 에 해당한다. 4 Hz 로
    # 떨어지면 같은 15 cm 가 60 cm/s 가 되어 3.5배 더 조여진다.
    # 그러면 멀쩡한 관측이 전부 이상치로 걷어차이고 추정치가
    # 얼어붙는다. 얼어붙은 추정치는 base_link 기준 고정이라 차가
    # 움직여도 제자리에 머물러, 화면에서는 "경로가 천천히 원래
    # 자리로 돌아오는" 것으로 보인다.
    #
    # 실측: 부하로 프레임이 느려진 구간 로그 60건에서 편차
    # 중앙 30.4 cm / 최대 76.8 cm 였다 (당시 상한 15.0).
    # 재잠금이 105 회 걸렸다.
    path_ema_gate_cm: 15.0

    # 위 게이트를 dt 로 넓힐 때의 배율 상한. 파이프라인이 멎었을 때
    # 게이트가 통째로 무력화되는 것을 막는다.
    # 6 이면 2.3 Hz 이하에서는 더 안 넓어진다 (15 -> 90 cm).
    path_ema_gate_dt_scale_max: 6.0

    # 기각이 이만큼 연속되면 실제 변화로 보고 재잠금 [프레임].
    #
    # 5 -> 3 (2026-08-24). 5 프레임이면 14 Hz 에서 0.36 초, 느린
    # 프레임(4 Hz)에서는 1.25 초 동안 추정치가 얼어붙은 채로 나간다.
    # 그동안 하류는 낡은 경로를 그대로 쓴다. 재잠금 자체가 순간이동이
    # 아니라 path_max_step_cm_per_s 로 캡이 걸린 이동이므로, 빨리
    # 재잠금해도 튀지 않는다 — 늦게 재잠금하는 쪽의 손해가 더 크다.
    path_ema_relock_frames: 3

    # 관측이 이만큼 연속으로 없으면 추정치를 폐기 [프레임].
    # 14 Hz 이므로 14 = 1 초. pan 탐색으로 경로가 끊긴 동안도
    # 여기에 걸린다.
    path_ema_reset_frames: 14

    # --------------------------------------------------------
    # Pan 트리거 판정 — 곡률 룩어헤드 + 장애물 (map 프레임)
    #
    # 차선이 화면에서 사라지는 이유는 두 가지다.
    #
    #   1. 코너를 돌면서 시야 밖으로 나갔다  -> 고개를 돌리면 보인다
    #   2. 앞의 장애물에 가렸다              -> 돌려도 안 보인다
    #
    # 2번에서 탐색을 걸면 가린 물체가 시야를 따라오므로 상한까지
    # 헛돌고, 그동안 경로만 끊긴다. 영상만으로는 둘을 구분할 수 없다.
    #
    # ★ 2026-08-24: /scan_filtered 직접 스캔 방식을 걷어내고 map
    #   프레임 정보 두 가지로 바꿨다.
    #
    #   곡률   /path/global(kau_global_path) 위 자차 전방
    #          curvature_lookahead_m 안의 최대 곡률.
    #   장애물 /perception/obstacles(kau_object_detection) 중
    #          소실된 쪽 전방 obstacle_ahead_max_m 안의 원.
    #
    #   /perception/obstacles 는 이제 Gazebo 참값이 아니라
    #   tf2(map<-lidar_link)로 원을 앉히므로 실기에서도 쓴다
    #   (laser_scan_clusterer_node.cpp 참고). map <- base_link TF
    #   (Cartographer/AMCL)가 떠 있어야 둘 다 판정 가능하다 —
    #   없으면 fail-open (탐색을 막지 않는다).
    #
    #   둘이 엇갈리면(급커브 구간인데 장애물 원도 있음) 곡률을
    #   우선한다 — 트랙 경계벽 오검출 가능성이 더 크다.
    # --------------------------------------------------------

    # 2026-08-25: false. §9 억제는 두 근거가 다 측위에 의존한다 —
    # curvatureAheadKappa() 는 map<-base_link TF + /path/global 이,
    # obstacleAheadOnSide() 는 /perception/obstacles(map 프레임)가
    # 필요하다. 측위가 없으면 둘 다 죽어 curve_ahead 가 영구 false 가
    # 되고(로그: "경로곡률 0.0000 ... 가림으로 보고 pan 하지 않는다"),
    # §8 이 "왼쪽 흰선 3프레임 연속 소실 -> +15deg" 를 내도 매번
    # 되돌려진다. 판단할 근거가 없는 게이트는 열어 둔다.
    obstacle_pan_block_enable: false

    # 자차 위치에서 /path/global 전방 이만큼 [m] 을 살펴 최대 곡률을
    # 잰다. 최소회전반경(~50cm)과 예전 pan 트리거 반응거리(BEV
    # 룩어헤드 ~85cm) 사이 여유값.
    #
    # ★ 실측 전 초안값. 튜닝 필요.
    curvature_lookahead_m: 1.5

    # 위 구간의 최대 곡률 [1/cm] 이 이 이상이면 "원래 급커브" 로
    # 보고 장애물 판정 없이 탐색을 진행한다 (곡률 우선). 0.01 1/cm
    # = 반경 약 100cm.
    #
    # ★ 실측 전 초안값. 튜닝 필요.
    curve_ahead_kappa_thresh: 0.01

    # 가려지지 않은 쪽(노란 중앙선)의 꺾임 [deg] 이 이 이상이면
    # 역시 급커브로 본다 (경로곡률과 OR). 측위/전역경로가 없어도
    # 항상 계산되므로, 그게 아직 안 떴을 때도 직선 구간에서 가려진
    # 흰선에 pan 이 걸리는 걸 막는다.
    #
    # ★ 실측 전 초안값. 튜닝 필요.
    curve_ahead_bend_deg_thresh: 15.0

    # 소실된 쪽 전방 이 거리 [m] 안에 장애물 원이 있으면 가림으로
    # 본다 (곡률이 급커브를 가리키지 않을 때만).
    #
    # ★ 실측 전 초안값. 튜닝 필요.
    obstacle_ahead_max_m: 1.0

    # 장애물 원이 차량 종축에서 이 횡거리 [m] 이내여야 우리 차로
    # 안으로 본다. 트랙 경계벽은 차로 폭 밖이라 이 조건을 구조적
    # 으로 통과하지 못한다 (트랙이 닫힌 루프이고 실제 벽 메시가
    # 있다 — physicar-sim meshes/physicar_base/wall.dae).
    #
    # 값은 흰선의 횡거리 상한이다. lane_width_cm 31.25 기준 흰선은
    # 0.16~0.47 m 옆이므로 여유를 두어 0.5 로 잡았다.
    #
    # ★ 키우면 벽이 다시 새고, 줄이면 비스듬히 가린 장애물을 놓친다.
    obstacle_lane_lateral_m: 0.5

    # /perception/obstacles 가 이보다 오래되면 판정하지 않는다 [s].
    # 근거가 없을 때 탐색을 막지는 않는다 (fail-open).
    obstacle_scan_timeout_s: 0.5

    # --------------------------------------------------------
    # Pan 기반 Lane Lost Recovery
    #
    # 한쪽 흰선이 pan_trigger_miss_frames 프레임 연속으로 안
    # 잡히면 그 방향으로 카메라를 pan_step_deg 씩 돌려 찾고,
    # 찾으면(또는 pan_max_deg 까지 못 찾으면) 0 으로 복귀한다.
    #
    # ★ pan != 0 인 동안에는 경로를 새로 짓지 않는다.
    #
    #   BEV 호모그래피가 "카메라가 정면(pan=0)" 을 가정하고
    #   고정 사다리꼴로 짜여 있어서, 카메라가 돌아간 프레임의
    #   BEV 좌표는 base_link 와 대응이 깨진다. 동적 BEV
    #   (tf2 로 base_link <-> camera_optical_frame 을 매 프레임
    #   조회해 행렬을 다시 계산) 는 아직 없다.
    #
    #   그래서 탐색/복귀 동안 /lane/center 가 끊긴다. 하류
    #   path_follower 는 path_timeout(기본 0.5 s) 을 넘기면
    #   정지하므로, 켜면 "차선 하나 놓칠 때마다 잠깐 선다".
    #   주행과 같이 켤 값이 아니라 인지 실험용이다.
    #
    # 인터페이스 (physicar_driver_node / model.sdf 대조 완료):
    #
    #   /camera/pan     std_msgs/Float64, 절대각 [rad]
    #                   실기: apply_pan() 이 ±30도로 클램프
    #                   시뮬: JointPositionController (p=15, d=0.1)
    #
    #   /joint_states   camera_pan_joint position [rad], 50 Hz
    #                   시뮬: Gazebo 실측 관절각 (진짜 피드백)
    #                   실기: 드라이버가 마지막 명령각을 그대로
    #                         되쏜다 (서보 인코더 없음) — 즉
    #                         실기에서 settle 판정은 항상 즉시 참
    #
    #   회전 부호: URDF/SDF 모두 camera_pan_joint axis = +Z 이므로
    #             +rad = 왼쪽(반시계), -rad = 오른쪽. 한계 ±0.5236 rad.
    # --------------------------------------------------------

    # 기본 켜둠.
    #
    # 탐색/유지/복귀 동안(pan_state != Idle)에는 카메라 자세가
    # bevScale() 의 전제(pan=0)와 어긋나므로 그 프레임의 경로를
    # 새로 짓지 않는다. publishLanePath 가 발행을 건너뛰므로
    # 하류는 직전 /lane/center 를 그대로 들고 간다.
    #
    # 즉 "경로가 끊긴다" 가 아니라 "경로가 낡는다" 이다. 다만
    # pan_hold_timeout_s 가 0(무한 대기)이면 직선 구간을 만날
    # 때까지 Holding 이 계속되므로 낡는 시간에 상한이 없다.
    # 주행 중 그게 곤란하면 pan_hold_timeout_s 에 값을 주거나
    # launch 에서 pan_search:=false 로 끈다.
    # ------------------------------------------------------------
    # 기동 tilt
    #
    # BEV 는 bev_vanishing_y 로 카메라 pitch 를 전제한다. 그 각도를
    # 실제로 세우는 주체가 없으면 지평선 행이 어긋난 채 돌아간다.
    # 그래서 이 노드가 기동 시 직접 세운다 — 제어량이 아니라 고정
    # 자세라 램프도 상태기계도 없다.
    #
    # 부호는 /camera/tilt 규약 그대로 + 가 아래다
    # (camera_tilt_joint axis = +Y, URDF/SDF 공통).
    # bev_vanishing_y 유도에 쓰는 광학 pitch 부호와는 반대다
    # (그쪽은 아래가 음수: vanishing_y = cy + fy*tan(pitch)).
    #
    # 2.0 deg 하향 기준 유도값 (fy 261.559):
    #   시뮬 cy 180.000 -> bev_vanishing_y 169.57  (현재 설정)
    #   실차 cy 169.603 -> bev_vanishing_y 159.17
    # 이 값을 바꾸면 bev_vanishing_y 를 반드시 같이 다시 유도할 것.
    camera_tilt_enable: true
    camera_tilt_deg: 2.0

    # 1 Hz 로 이 시간(초)만큼 반복 발행하고 타이머를 끈다.
    camera_tilt_repeat_s: 5.0

    pan_search_enable: true

    # 탐색 첫 목표각 [deg].
    #
    # 차선이 화면에서 빠지는 건 대개 코너라 3도씩 기어가면
    # 재검출까지 프레임을 낭비하고 그동안 경로도 낡는다.
    # 쓸 만한 각도를 먼저 목표로 잡고, 거기서도 없으면 아래
    # pan_step_deg 씩 훑는다.
    #
    #   15 -> 18 -> 21 -> ... -> 30 (pan_max_deg 초과 시 포기)
    #
    # 목표 사이 이동은 전부 pan_rate_deg_s 램프다 (아래).
    pan_start_deg: 15.0

    # 시작 각도에서 못 찾았을 때 한 스텝 회전량 [deg]
    pan_step_deg: 3.0

    # 목표각으로 다가가는 각속도 상한 [deg/s]. 0 이면 램프 없이
    # 즉시 이동 (예전 스텝 동작).
    #
    # 예전에는 목표각을 한 프레임에 그대로 발행했다. 서보는 매번
    # 최대 슬루로 쫓아가는 상태가 되고, 그 도중에 찍힌 영상이 계속
    # 들어온다. 그 영상으로 지은 경로를 회전 보정할 때 쓰는 각도
    # (actual_pan_deg)는 영상 시각이 아니라 처리 시각의 값이라,
    # 슬루가 빠를수록 어긋남이 커진다. 77cm 경로 기준:
    #
    #   Δθ 3도  -> 끝단 4.0 cm
    #   Δθ 8도  -> 끝단 10.7 cm
    #   Δθ 15도 -> 끝단 19.9 cm
    #
    # 각속도를 묶으면 그 어긋남의 상한도 같이 묶인다:
    #   끝단 오차 <= L * rate * (파이프라인 지연)
    #
    # 2026-08-25: 30 -> 60 deg/s. 탐색이 느려 pan 이 도는 동안
    # /lane/center 가 끊기는 시간이 길었다. 대가는 회전 보정 오차다:
    #
    #   30 deg/s, 지연 50 ms -> 1.5도 -> 77cm 에서 2.0 cm
    #   60 deg/s, 지연 50 ms -> 3.0도 -> 77cm 에서 4.0 cm   <- 현재
    #
    # 위 표의 "Δθ 3도 -> 끝단 4.0 cm" 와 같은 값이다. 도로 반폭이
    # 31.25 cm 이므로 4 cm 는 아직 여유가 있지만, 여기서 더 올리면
    # (예: 90 deg/s -> 6.0 cm) 경로가 눈에 띄게 밀린다.
    # 즉 램프는 부드러움만이 아니라 **회전 보정 오차의 상한**을
    # 준다 — 점프 방식보다 오히려 정확하다.
    #
    # 소요 시간: 0->15도 0.25 s, 한 스텝 3도 0.05 s,
    #            0->30도 전량 0.50 s.
    #
    # 실기 주의: 서보 인코더가 없어 /joint_states 가 명령의 에코라
    # 서보 정착 판정은 항상 참이다. 램프의 "목표 도달" 판정이 그
    # 공백을 메우므로, 이 값을 0 으로 두면 실기에서는 정착 대기가
    # 사실상 사라진다.
    #
    # ★ 서보 슬루 상한을 넘기면 안 된다. 넘으면 명령만 앞서 나가고
    #   실측이 못 따라와, 회전 보정에 쓰는 각도가 실제와 어긋난다.
    pan_rate_deg_s: 60.0

    # 탐색 상한 [deg].
    #
    # 서보 하드리밋이 ±30 이고 (physicar_driver_node MAX_PAN,
    # URDF/SDF limit ±0.5236 rad) 그 안에서 전부 쓴다.
    # 탐색은 이 각도까지 훑고, 못 찾으면 포기하고 복귀한다.
    pan_max_deg: 30.0

    # 서보 정착 판정 허용오차 [deg]. |실측 - 발행각| 이 이 안이면
    # 카메라가 명령을 따라잡은 것으로 본다.
    #
    # 다음 스텝으로 넘어가는 조건은 이것 **하나가 아니다**:
    #   settled = (램프가 목표에 도달) && (서보가 명령에 도달)
    # 실기는 실측이 명령의 에코라 뒤쪽 항이 항상 참이므로,
    # 실질적인 정착 대기는 앞쪽 항(램프)이 만든다.
    pan_settle_tol_deg: 1.0

    # 이만큼 연속으로 한쪽 흰선이 안 잡히면 탐색 시작 [프레임].
    # 14 Hz 이므로 3 프레임 = 0.21 초.
    pan_trigger_miss_frames: 3

    # --- 재검출 인정 기준 (Searching -> Holding) ---
    #
    # 놓친 흰선이 "다시 보인다" 고 인정해 그 각도에 정지하는
    # 조건. 창 수와 연속 프레임 수를 모두 만족해야 한다.
    #
    # 예전에는 found_count > 0, 즉 창 하나였다. min_pixels(20)
    # 만큼의 흰 픽셀이 회랑 안에 한 번 잡히면 멈췄다는 뜻이고
    # 문제가 셋이었다:
    #
    #  (a) 슬라이딩 윈도우는 found_count >= 3 을 넘겨야
    #      detected/valid 로 친다. pan 정지만 그보다 느슨해서
    #      "차선으로 인정도 안 되는 검출" 에 멈췄다.
    #  (b) 탐색 시작은 pan_trigger_miss_frames(3) 프레임 연속
    #      소실이 필요한데 정지는 1프레임이었다. 시작은 어렵고
    #      멈추기는 쉬운 반대 방향 히스테리시스라 반짝임 하나에
    #      탐색이 중단됐다.
    #  (c) 창 하나는 선 끄트머리가 화면 가장자리에 겨우 걸친
    #      상태다. 거기서 Holding 에 들어가면 경로 품질이
    #      회복되지 않은 채 유지된다.
    #
    # track_step_px 25 기준 6창은 호길이 약 150 px 이다.
    #
    # ★ 올리면 예전에 18도에서 멈추던 것이 pan_max_deg 까지
    #   가고, 거기서도 못 채우면 실패 판정이 난다. 실패가
    #   잦아지면 이 값을 먼저 내릴 것.
    pan_found_min_windows: 6

    # 위 창 수 조건이 연속으로 성립해야 하는 프레임 수.
    # pan_trigger_miss_frames 와 대칭을 맞추기 위한 것이다.
    # 크게 잡으면 탐색이 지나쳐 버린 각도에서 멈춘다.
    pan_found_confirm_frames: 2

    # 재검출 직후 추가로 더 돌릴 각도 [deg].
    #
    # 0 = 찾은 그 각도에서 그대로 정지 (기본).
    #
    # 찾은 선이 화면 가장자리에 걸쳐 있어 금방 다시 빠진다면
    # 몇 도 줘서 안쪽으로 당겨 놓을 수 있다. pan_max_deg 는
    # 그대로 지켜진다 (commandPan 이 클램프).
    pan_overshoot_deg: 0.0

    # --- 재검출 후 복귀 조건 (Holding) ---
    #
    # 찾자마자 복귀하면 그 선을 곧바로 다시 놓친다. pan 이
    # 왕복하고 그동안 경로가 계속 끊긴다. 그래서 찾은 각도를
    # 유지한 채 기다렸다가 복귀한다.
    #
    # ★ 판정 기준: "정면으로 돌아가도 그 선이 보이는가"
    #
    #   예전에는 "도로가 펴졌는가"(추적점의 꺾임각)를 봤다.
    #   그런데 그건 다른 명제다. 실측에서 정지 상태의 곧은
    #   구간인데 왼쪽 흰선이 화면 밖에 있었다. 도로는 곧으니
    #   직선 판정은 통과하고, 복귀하면 여전히 안 보이니 즉시
    #   재탐색이 걸렸다 — 15초에 9번 왕복했다. 직선 임계값을
    #   아무리 조여도 멎지 않는 종류의 문제다.
    #
    #   그래서 목적을 직접 잰다. BEV -> 원본 영상 역호모그래피로
    #   추적점의 영상각 a = atan((u-cx)/fx) 을 복원하면, pan 각
    #   theta 에서 본 그 점은 pan = 0 일 때 영상각 (a - theta)
    #   에 온다. 이것이 화면 반각 안에 드는 점이
    #   pan_return_min_points 개 이상이면 복귀해도 다시 잡는다.
    #
    #   역호모그래피는 원본 영상과 BEV 사이의 순수 2D 사상이라
    #   pan 으로 깨진 평면 가정과 무관하게 정확하다. 깨지는 것은
    #   BEV 좌표의 "미터 해석" 이지 픽셀 대응이 아니다.
    #
    # 화면 가장자리 여유 [deg]. 반각에서 이만큼 뺀 범위만
    # "보인다" 로 친다. 가장자리에 겨우 걸친 선은 차가 조금만
    # 움직여도 다시 빠지기 때문이다.
    pan_return_fov_margin_deg: 3.0

    # 복귀 판정이 이만큼 연속돼야 실제로 복귀한다 [프레임].
    pan_return_confirm_frames: 3

    # 복귀 판정에 필요한 최소 추적점 수.
    #
    # "정면으로 돌아가도 화면에 남는 점" 이 이만큼 있어야
    # 복귀한다. 검출이 다시 성립하려면 그 정도 근거는 필요하다.
    #
    # (아래 표는 이 값을 처음 도입할 때의 근거다. 그때는 판정이
    #  꺾임각이었고, 짧은 점열이 어떤 코너에서도 직선으로 보이는
    #  것을 막으려 했다. 판정 기준이 바뀐 지금도 "검출이 성립할
    #  만한 최소 근거량" 이라는 의미는 그대로다.)
    #
    # ★ 이 값이 없으면 코너 한복판에서 복귀해 버린다.
    #
    #   trackBendDeg 는 4점이면 각을 낸다. 4점 = 3스텝 x
    #   track_step_px(25px) = 75px, 약 24cm. 그 길이로는 어떤
    #   코너도 직선으로 보인다 — 반지름 150cm 코너도 24cm
    #   구간의 방향 변화는 9도뿐이고, 절반씩 갈라 재면 5도
    #   아래로 떨어져 pan_return_bend_deg(8) 를 통과한다.
    #
    #   특히 노란선이 없을 때 대신 쓰는 흰선은 방금 겨우
    #   재검출된 짧은 선이라 거의 항상 이 함정에 빠진다.
    #
    #   실측 (track_step_px 25, sx 0.322 cm/px). 절반 비교값과
    #   pan_return_bend_deg(8.0) 통과 여부:
    #
    #     점수  구간     R=100cm      R=150cm      R=250cm
    #      4    24cm    6.9 통과     4.6 통과     2.8 통과  <- 전부 오판
    #      6    40cm   11.5 기각     7.7 통과     4.6 통과
    #      8    56cm   16.1 기각    10.8 기각     6.5 통과
    #     10    72cm   20.8 기각    13.8 기각     8.3 기각  <- 채택
    #     12    89cm   25.4 기각    16.9 기각    10.1 기각
    #
    #   10점이면 완만한 곡선(R=250cm)까지 기각한다. 정상 검출
    #   시 추적점은 12~15개 나오므로(status 의 lw/yw/rw) 달성
    #   가능한 값이다.
    #
    #   올릴수록 Holding 이 길어지고 그동안 /lane/center 가
    #   끊겨 있다. 내리면 코너에서 성급히 복귀한다.
    pan_return_min_points: 10

    # 직선이 끝내 안 나올 때의 탈출구 [s].
    #
    # ★ 0 이하 = 무한 대기. 직선을 만날 때까지 복귀하지 않는다.
    #
    # Holding 동안에는 경로를 짓지 않으므로 그동안 /lane/center
    # 가 계속 끊겨 있다. 즉 이 기본값으로는 직선 구간이 나오기
    # 전까지 하류(kau_control)가 경로를 못 받는다 — 의도된
    # 동작이다. 곤란해지면 양수로 바꿔 상한을 준다.
    pan_hold_timeout_s: 0.0

    # 명령 부호 뒤집개. 카메라가 명령과 반대로 돌면 -1.0.
    #
    # URDF/SDF 기준으로는 하드웨어가 명령대로 도는 것이 맞으므로
    # 1.0 이다 (+rad = 왼쪽). 실기에서도 그대로 확인했다.
    #
    # 탐색 방향(왼쪽 소실 -> 왼쪽으로) 은 updatePanSearch 의
    # pan_search_dir_ 가 정한다. 이 값으로 덮지 말 것 — 둘을
    # 섞으면 나중에 어느 쪽이 하드웨어 문제였는지 못 가린다.
    pan_sign: 1.0

    # pan 회전축이 base_link 원점에서 떨어진 거리 [cm].
    # 경로를 base_link 로 되돌릴 때의 회전 피벗이다.
    #
    # ★ (0,0) 은 초안값이다 (CLAUDE.md 12). URDF 실측은 약 (5,0).
    #   pan=0 에서는 값이 얼마든 결과가 같으므로 카메라 마운트를
    #   재실측할 때 같이 넣는다. 피벗이 d 만큼 어긋나면 오차는
    #   d*2sin(theta/2) -- 15 도에서 1.3 cm, 30 도에서 2.6 cm 다.
    pan_pivot_offset_x_cm: 0.0
    pan_pivot_offset_y_cm: 0.0

    # ============================================================
    # Pan 조준 (feedforward)
    #
    # 위 탐색 상태기계(pan_search_*)를 대체한다. 켜져 있으면
    # 상태기계는 돌지 않고 Idle 로 눌려 있는다.
    #
    #   상태기계  차선을 놓친 뒤 그쪽으로 돌려 찾는 되먹임
    #   조준      도로가 휜 만큼 미리 돌리는 앞먹임
    #
    # 되먹임의 문제는 검출 -> pan -> 검출 이 닫힌 고리라 발진한다는
    # 것이다 (CLAUDE.md 8장 실측: 15초에 9번 왕복). 탐색 지연도
    # 크다 — 3프레임 소실 감지 후 램프+정착+3도 스텝이라 커브가
    # 끝날 무렵 도착한다. 조준은 상태 래치가 없어 그 두 가지가
    # 구조적으로 없다.
    #
    # ★ 되돌리기: pan_aim_enable 만 false 로 두면 예전 동작 그대로다.
    #   매 프레임 다시 읽으므로 주행 중에도 먹는다:
    #     ros2 param set /kau_lane_detection_node pan_aim_enable false
    #
    # 근거가 없으면 자동으로 탐색 상태기계로 넘어간다 (아무것도
    # 못 하는 구간이 생기지 않도록).
    #
    # pan_search_enable: false 가 우선한다 — 그건 "카메라를 아예
    # 움직이지 마라" 라서 조준도 같이 꺼진다.
    # ============================================================
    pan_aim_enable: true

    # 전역경로 위 자차 최근접점에서 호길이로 이만큼 [m] 전진한
    # 점을 조준한다.
    #
    # 원호 위에서 조준각은 psi = d/(2R) + atan(e/d) 다
    # (R 곡률반경, e 횡오차). 앞항이 곡률분, 뒷항이 횡오차분이다.
    #
    # ★ d 와 pan_aim_gain 은 **등곡률 원호 위에서만** 곱으로 작용한다
    #   (gain * d / 2R). 그 조건에서는 둘을 같이 튜닝하면 서로를
    #   상쇄하므로 d 를 고정하고 gain 으로만 조절하는 게 맞다.
    #
    #   ★ 단, "직선 -> 코너" 처럼 곡률이 변하는 구간에서는 그 등가가
    #     깨진다. 조준점은 호길이로 정확히 d 앞의 한 점이므로,
    #     **꺾기 시작하는 거리는 d 혼자 정한다.** gain 은 크기만
    #     바꿀 뿐 시작 시점을 못 옮긴다. 코너 진입 타이밍을
    #     조절하려면 건드릴 값은 gain 이 아니라 d 다.
    #
    # 1.0 m 이던 이유: gain 1.0 과 묶으면 포화점이 R = 0.955 m 라
    # 트랙 최급커브 기준선(curve_ahead_kappa_thresh 0.01 = R 100 cm)
    # 과 +-30도 한계가 거의 맞았다.
    #
    # 1.5 (더 멀리) 와 0.6 (더 가까이) 을 둘 다 시험했으나 "직선
    # 구간에서 먼저 꺾는다" 증상이 양쪽 모두에서 그대로였다
    # (2026-08-25). 다만 그때 lane_detection 노드가 두 개 떠 있어
    # /lane/center 발행자가 둘이었으므로, 그 관측으로 pan 조준
    # 거리를 원인에서 배제하기에는 근거가 약하다.
    #
    # 현재 0.7 로 두고 재관측 중이다. gain 1.0 기준 곡률분:
    #
    #   R [m]   pan 명령       (d=1.0 일 때)
    #   0.67-   30.0 (포화)    30.0 (R 0.955 이하)
    #   1.0     20.1           28.6
    #   1.5     13.4           19.1
    #   2.5      8.0           11.5
    #   5.0      4.0            5.7
    #
    # 조준 시작 거리는 100 -> 70 cm 로 당겨지고, 횡오차분
    # atan(e/d) 는 e=15 cm 에서 8.53 -> 12.1 도로 커진다.
    #
    # ★ 실측 전 초안값. 튜닝 필요.
    pan_aim_lookahead_m: 0.7

    # 조준 방위각에 곱하는 배수. pan_max_deg 클램프는 그 뒤에 걸린다.
    #
    # lookahead **1.0 m**, gain 1.0 에서 곡률분만 본 값
    # (아래 두 표는 d=1.0 시절 기준이다. 현재 d 는 0.6 이라
    #  현재 d 도 1.0 이라 그대로 유효하다):
    #
    #   R [m]   kappa [1/cm]   pan 명령
    #   0.95-   0.0105+        30.0 (포화)
    #   1.0     0.0100         28.6
    #   1.5     0.0067         19.1
    #   2.5     0.0040         11.5
    #   5.0     0.0020          5.7
    #
    # 위 표는 원(quintic 근사) 위에서 구현부 로직을 그대로 돌려
    # 검증했다 — d/(2R) 와 0.005도 이내로 일치한다.
    #
    # 횡오차분은 노이즈가 아니라 신호다 — 차가 실제로 밀려 있으면
    # 차선도 그만큼 밀려 보이므로 카메라가 따라가는 것이 맞다.
    # 다만 +-30도 예산을 곡률분과 나눠 쓰게 되므로, 바깥으로 밀린
    # 채 급커브에 들어가면 곡률분이 그만큼 잘린다 (같은 검증 기준):
    #
    #   R [m]   e=0     e=10cm   e=20cm
    #   1.0     28.65   33.63    38.10  <- 30 포화
    #   1.5     19.10   24.42    29.33
    #   2.5     11.46   16.98    22.20
    #   5.0      5.73   11.36    16.79
    #
    # ★ lane 소스에서는 1.0 을 쓰지 말 것 (아래 pan_aim_source 주석).
    #   서보 추종 지연이 그대로 되먹여지는 경로가 있어 DC 루프게인
    #   1 이면 그 오차가 안 죽는다. global 소스로 되돌릴 때는 고리
    #   자체가 없으므로 1.0 으로 올려도 된다.
    #
    # ★ 실측 전 초안값. 튜닝 필요.
    pan_aim_gain: 0.7

    # ------------------------------------------------------------
    # 조준 근거
    #
    #   lane    이 노드가 방금 만든 중심선 경로 (기본)
    #   global  /path/global + 측위 (예전 동작)
    #
    # lane 이 성립하는 이유는 경로(path.ctrl)가 이미 base_link
    # 기준이기 때문이다 — buildCenterlinePath 가 camera_yaw_deg
    # 만큼 회전 보정해 둔다. 즉 거기서 잰 방위각은 "카메라가 보는
    # 방향 기준" 이 아니라 차체 기준 절대각이라, 카메라를 돌려도
    # 값이 안 변한다. 각이 적분되지 않으므로 발산 모드가 없다.
    #
    # 그리고 조준 거리를 valid_length_cm(근거가 끊기기 전까지의
    # 호길이)로 자르므로, 차선이 가리면 **가려지지 않은 데까지만**
    # 보고 조준하는 동작이 저절로 나온다.
    #
    # ★ 완전히 열린 고리는 아니다. 회전 보정에 쓰는 각도가 실기에선
    #   서보 인코더가 없어 명령의 에코라, 추종 지연만큼 경로가
    #   과회전되고 그게 방위각에 더해져 다음 명령을 키운다. 그래서
    #   pan_aim_gain 을 1 미만으로 둔다.
    #
    # lane 의 이점 — 측위 의존이 통째로 사라진다. AMCL 지터가 안
    # 실리고, global 소스에 걸려 있던 "Cartographer 와 같이 쓰지 말
    # 것"(허위 각속도 96deg/s) 제약이 없어진다. /path/global 이
    # 없어도, 측위가 죽어도 pan 이 산다.
    #
    # lane 이 잃는 것 — 진짜 앞먹임. 전역경로는 아직 안 보이는
    # 커브를 알지만 차선은 보이는 데까지만 안다. 급커브 진입에서
    # 차선이 FOV 밖으로 먼저 나가면 선행할 수 없다.
    #
    # 실차에서 주행 중 A/B 비교가 된다 (매 프레임 다시 읽는다):
    #   ros2 param set /kau_lane_detection_node pan_aim_source global
    # ------------------------------------------------------------
    pan_aim_source: "lane"

    # 조준하려면 근거(valid_length_cm)가 최소 이만큼 [cm] 있어야
    # 한다. lane 소스에서만 쓴다.
    #
    # 짧은 점열은 어떤 코너에서도 직선으로 보인다 (8장 "짧은 점열
    # 로는 판정하지 않는다" 의 표 — 24cm 면 R=100cm 도 통과한다).
    # 근거가 이보다 짧으면 조준각을 만들지 않고 홀드로 넘긴다.
    #
    # 올리면 가림에 더 보수적이 되고(홀드/탐색으로 잘 넘어간다),
    # 내리면 짧은 근거에도 조준한다. 25 는 경로 시작점(카메라 앞
    # 약 32cm)에서 그만큼 더 나간 지점까지 근거가 있다는 뜻이다.
    #
    # ★ 실측 전 초안값. 튜닝 필요.
    pan_aim_min_evidence_cm: 25.0

    # 조준각이 직전 **목표각**에서 이만큼 [deg] 넘게 달라졌을 때만
    # 목표를 다시 세운다.
    #
    # 매 프레임 목표가 미세하게 바뀌면 램프가 계속 다시 출발해
    # "꺾다 말다" 하는 움직임이 된다 (8장 각속도 램프 절의 그 증상).
    # 비교 기준이 직전 조준각이 아니라 직전 목표각이라 오차가
    # 누적되지 않는다 — 정상상태 오차 상한이 이 값 그대로다.
    pan_aim_deadband_deg: 2.0

    # 근거가 빈 프레임을 몇 장까지 직전 조준각으로 버틸지.
    #
    # 여기서 0 으로 되돌리면 안 된다 — "안 보임 -> 정면 복귀 ->
    # 보임 -> 다시 조준" 이 8장 실측 왕복(15초 9회)의 형태 그대로다.
    # 점선 공백이나 순간 가림 한두 장은 홀드로 넘긴다.
    #
    # 이 장수를 넘기면 조준을 포기하고 탐색 상태기계로 넘긴다
    # (차선이 통째로 사라진 상황은 "찾아 도는" 쪽이 맡는 게 맞다).
    # 14 프레임 = 14Hz 기준 약 1초.
    pan_aim_hold_frames: 14

    # 조준각 상한을 정할 때 수평 반각에서 뺄 여유 [deg].
    #
    # 상한 = min(pan_max_deg, atan(cx/fx) - 이 값). 너무 돌려서
    # 근거를 잃고 -> 조준 무효 -> 복귀 -> 다시 보임 이 되풀이되는
    # 것을 막는 안전턱이다.
    #
    # ★ 현재 광학(fx 201.4 / cx 240 -> 반각 50도)에서는 여유
    #   45도 > pan_max_deg 30도 라 **걸리지 않는다.** pan_max_deg 를
    #   올리거나 렌즈를 바꿀 때 살아나는 값이다.
    pan_aim_fov_margin_deg: 5.0


# ============================================================
# BEV 웹 뷰어 (scripts/lane_viewer.py). 관측 전용 노드다.
# ============================================================

kau_lane_detection_viewer:
  ros__parameters:

    # 웹 뷰어 포트 (http://localhost:<port>).
    # 이미 쓰이는 포트면 뷰어만 뜨지 않고 인지 노드는 정상 동작한다.
    port: 5000
