# kau_gui · 주행 디버깅 GUI
#
# 관측 전용. publisher / service client 를 만들지 않는다 (docs/09 section 2).
# bringup.yaml 에 넣지 않는다. Supervisor 가 spawn 하는 대상이 아니다.

/**:
  ros__parameters:

    # --- 렌더 ---
    # ROS 수신 주기와 무관하다. 화면만 이 주기로 다시 그린다.
    # 플롯 데이터는 콜백에서 전량 링버퍼에 쌓으므로 50 Hz 신호도 누락되지 않는다.
    render_hz: 10.0
    history_s: 30.0                 # 플롯 x 축 길이 = 롤링 버퍼 길이

    # --- 프레임 ---
    # map -> odom -> base_link 를 map 패널에 ROS 표준 축 마커로 그린다.
    frames:
      map: "map"
      odom: "odom"
      base: "base_link"

    # 맵의 TF 축 마커 길이 [cm]
    tf_axis_cm: 20.0

    # --- LiDAR 점군 ---
    # 색은 센서로부터의 거리다 (rviz 의 rainbow 와 같은 팔레트).
    #   near_m  보라  ...  far_m  빨강
    # 고정 범위다. rviz 기본처럼 매 프레임 자동으로 잡으면 차가 벽에 다가갈
    # 때마다 온 화면 색이 같이 흔들려 거리를 못 읽는다.
    #
    # 12.0 은 실측에 맞춘 값이다 (2026-08-24, /scan_filtered 유효점 720):
    # 중앙값 3.6 m · 95 % 10.8 m · 최대 11.2 m. 라이다 range_max 는 16 m 지만
    # 12 x 7 m 방에서는 그 위가 안 나와서, 16 으로 두면 팔레트 1/4 을 버린다.
    scan:
      near_m: 0.0
      far_m: 12.0
      point_size: 3.0

    # --- 맵 배경 ---
    # kau_localization 이 share 에 설치하는 maps/<name>.yaml + pgm 을 읽는다.
    # bringup.yaml 의 "@kau_localization:maps/kau_v3.yaml" 과 같은 지도다.
    # yaml_path 를 주면 그쪽이 우선한다 (설치 안 된 지도를 볼 때).
    map:
      package: "kau_localization"
      name: "kau_v3"
      yaml_path: ""

    # --- 구독 토픽 ---
    topics:
      scan: "/scan_filtered"
      obstacles: "/perception/obstacle_markers"
      path_global: "/viz/path/global"
      path_local: "/viz/path/local"
      path_lane: "/viz/path/lane"
      speed_cmd: "/speed"           # target speed
      odom: "/odom"                 # measured speed. /odometry/filtered 아님
      steering: "/steering"         # commanded steer [rad]
      steer_debug: "/debug/steer"   # raw steer · Ld · heading err · cte
