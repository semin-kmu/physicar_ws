# kau_gui · 주행 디버깅 GUI
#
# 관측 전용. publisher / service client 를 만들지 않는다 (docs/09 section 2).
# bringup.yaml 에 넣지 않는다. Supervisor 가 spawn 하는 대상이 아니다.

/**:
  ros__parameters:

    # --- 렌더 ---
    # ROS 수신 주기와 무관하다. 화면만 이 주기로 다시 그린다.
    # 플롯 데이터는 콜백에서 전량 링버퍼에 쌓으므로 50 Hz 신호도 누락되지 않는다.
    #
    # 렌더 예산 (소프트웨어 raster 측정, 프레임당):
    #   antialias 끔      1610 -> 80 ms   viz.init
    #   5 Hz              -50 %
    #   history 15 s      -25 %  (플롯 점 수 1500 -> 750)
    #   창 1280x720       -13 %  viz.run
    # 올리려면 render_hz 부터 올릴 것. history_s 는 플롯 한 화면에 담기는
    # 시간이라 값을 바꾸면 보이는 것이 바뀐다.
    render_hz: 5.0
    history_s: 15.0                 # 플롯 x 축 길이 = 롤링 버퍼 길이

    # --- 프레임 ---
    # map -> odom -> base_link 를 map 패널에 ROS 표준 축 마커로 그린다.
    frames:
      map: "map"
      odom: "odom"
      base: "base_link"

    # 맵의 TF 축 마커 길이 [cm]
    tf_axis_cm: 20.0

    # --- LiDAR 점군 ---
    # 색은 센서로부터의 거리다 (rviz 의 rainbow 와 같은 팔레트).
    #   near_m  보라  ...  far_m  빨강
    # 고정 범위다. rviz 기본처럼 매 프레임 자동으로 잡으면 차가 벽에 다가갈
    # 때마다 온 화면 색이 같이 흔들려 거리를 못 읽는다.
    #
    # 12.0 은 실측에 맞춘 값이다 (2026-08-24, /scan_filtered 유효점 720):
    # 중앙값 3.6 m · 95 % 10.8 m · 최대 11.2 m. 라이다 range_max 는 16 m 지만
    # 12 x 7 m 방에서는 그 위가 안 나와서, 16 으로 두면 팔레트 1/4 을 버린다.
    scan:
      near_m: 0.0
      far_m: 12.0
      point_size: 3.0

    # --- 맵 배경 ---
    # kau_localization 이 share 에 설치하는 maps/<name>.yaml + pgm 을 읽는다.
    # bringup.yaml 의 "@kau_localization:maps/kau_v3.yaml" 과 같은 지도다.
    # yaml_path 를 주면 그쪽이 우선한다 (설치 안 된 지도를 볼 때).
    map:
      package: "kau_localization"
      name: "kau_v3"
      yaml_path: ""

    # --- 참값 트랙 ---
    # kau_lane_localization 이 share/config 에 설치하는 생성물을 읽는다
    # (gen_track_table.py 가 amet2026_track.json 에서 뽑은 것).
    # 정적이라 시작할 때 한 번만 그린다. 렌더 예산에 영향이 없다.
    #
    # centerline 은 global path 와 거의 겹친다 (실측 med 7.6 mm). 새로
    # 보이는 것은 코너 번호와 s 눈금이다 -- 차선 기반 측위가 s 를 코너에서
    # 리셋하므로 화면에서 코너를 세어 추정 s 를 대조할 수 있어야 한다.
    #
    # 패키지나 파일이 없으면 경고만 내고 트랙 없이 뜬다 (맵 배경과 같은 규약).
    track:
      enabled: true
      package: "kau_lane_localization"
      name: "track_amet2026"
      yaml_path: ""                 # 주면 package/name 보다 우선
      s_tick_m: 5.0                 # s 눈금 간격 [m]. 0 이면 눈금 없음
      labels: true                  # 코너 번호·회전각·s 값 글자

    # --- 구독 토픽 ---
    topics:
      scan: "/scan_filtered"
      obstacles: "/perception/obstacle_markers"
      path_global: "/viz/path/global"
      path_local: "/viz/path/local"
      path_lane: "/viz/path/lane"
      speed_cmd: "/speed"           # target speed
      odom: "/odom"                 # measured speed. /odometry/filtered 아님
      steering: "/steering"         # commanded steer [rad]
      steer_debug: "/debug/steer"   # raw steer · Ld · heading err · cte

    # --- 노드 상태 (최상단 띠) ---
    #
    # 감시 대상 목록은 여기 없다. kau_state_machine 의 bringup.yaml 을 읽어
    # 그대로 쓴다 -- run.sh 가 띄우는 노드의 정의가 그 파일 하나뿐이라
    # 목록을 여기 복사해 두면 manifest 가 바뀔 때마다 어긋난다.
    #
    # 제외: wait(관문, 스스로 끝난다) · ros=false(그래프에 이름이 없다)
    status:
      enabled: true
      bringup_yaml: ""              # 비우면 kau_state_machine share/config/bringup.yaml

      stale_ratio: 3.0              # 마지막 수신 > 기대주기 x 이 값 -> 빨강
      # stale 판정 하한. 50 Hz 토픽은 3 배가 60 ms 라 지터만으로도 빨간불이
      # 깜빡여 정작 진짜 고장이 묻힌다.
      min_stale_s: 0.3

      # bringup.yaml 의 option.<이름> 스위치. supervisor 파라미터라 관측 전용인
      # GUI 가 물어볼 수 없다 (docs/09 section 2). run.sh 설정과 맞출 것.
      options:
        lane_viewer: true           # run.sh 의 KAU_NODES 표와 맞출 것

      # 주기를 잴 대표 토픽. "<노드> | <topic> | <타입> | <기대 Hz>"
      # topics 에 이미 있는 토픽(/odom · /speed · /steering)은 표시용 구독에서
      # 주기를 같이 잰다. 여기 적어도 구독이 하나 더 생기지 않는다.
      # 여기 없는 노드는 그래프 존재만으로 판정하고 Hz 칸을 비운다
      #   map_amcl_lifecycle_manager  발행 토픽 없음
      #   map_server                  /map 은 latched
      #   state_machine               현재 스텁, 발행 없음
      #   kau_lane_detection_viewer   웹 뷰어(Flask). ROS 발행 없음
      #
      # 위 넷은 잴 대표 토픽이 아예 없다. Hz 칸에 "-" 가 뜬다 (status_bar.py).
      # 측정 실패(빨간불)와 구분하기 위한 표시다.
      watch:
        # 기대 Hz 는 2026-08-25 sim 주행 중 ros2 topic hz 실측값이다.
        # 이 값은 표시용이 아니라 stale 판정에만 쓰인다 -- 화면에 뜨는 Hz 는
        # 언제나 실측치다. 판정 한계는 max(stale_ratio/기대, min_stale_s).

        # /imu/cov(약 42 Hz) 가 아니라 느린 쪽을 본다. 둘 다 이 노드가 내므로
        # 하나만 봐도 되고, 느린 쪽이 끊김을 더 확실히 잡는다.
        - "odom_covariance_relay  | /odom/laser_cov       | nav_msgs/msg/Odometry            | 9"
        - "kau_ekf                 | /odom                 | nav_msgs/msg/Odometry            | 30"
        - "laser_scan_clusterer    | /perception/obstacles | kau_msgs/msg/ObstacleCircleArray | 10"
        - "start_signal_detector   | /perception/start_permission | std_msgs/msg/Bool         | 10"

        # ★ /amcl_pose 는 필터가 갱신될 때만 나간다. update_min_d 0.01 이라
        #   주행 중에는 스캔마다 갱신돼 실측 8.7 Hz 였지만, **정차하면 멈춘다.**
        #   기대를 실측 9 로 두면 한계가 0.33 초라 출발 대기 중에 바로 빨간불이
        #   된다. 그래서 일부러 낮춰 잡아 한계를 1.5 초로 벌렸다.
        #   그래도 오래 서 있으면 빨간불이 된다 -- 이 노드의 빨강은
        #   "죽었다" 가 아니라 "갱신이 없다" 로 읽을 것.
        - "amcl                    | /amcl_pose            | geometry_msgs/msg/PoseWithCovarianceStamped | 2"
        - "camera_info_bridge      | /camera/camera_info   | sensor_msgs/msg/CameraInfo       | 14"
        - "kau_lane_detection_node | /lane/center          | kau_msgs/msg/KauPath             | 14"
        # ★ global_path_publisher 를 rate>0 (기본 1 Hz) 으로 띄울 것.
        #   rate:=0 (1 회 발행) 이면 정상인데도 빨간불이 켜진다
        - "global_path_publisher   | /path/global          | kau_msgs/msg/KauPath             | 1"
        # ★ kau_local_path_planner/config/local_planner.yaml 의 plan_hz 와
        #   같은 값을 유지할 것 (2026-08-25: 10 -> 5).
        - "local_planner_node      | /path/local           | kau_msgs/msg/KauPath             | 5"
        - "steer_controller        | /steering             | std_msgs/msg/Float64             | 50"
        - "speed_controller        | /speed                | std_msgs/msg/Float64             | 50"
