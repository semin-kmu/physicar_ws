# ====================================================================
# 센서 신뢰도 — 이 파일이 EKF 신뢰도 배분의 유일한 손잡이다
#
# odom_covariance_relay 가 /odom/laser 와 /imu 에 아래 공분산을 채워서
# /odom/laser_cov, /imu/cov 로 다시 낸다. ekf.yaml 은 그 두 토픽을 본다.
#
# ── 왜 여기서 하나 ──────────────────────────────────────────────────
# robot_localization 에는 센서별 신뢰도 파라미터가 아예 없다.
# odom0_* 로 줄 수 있는 것은 _config / _differential / _relative /
# _queue_size / _rejection_threshold 뿐이고, **측정 신뢰도는 오직
# 메시지의 covariance 필드에서 온다.** 그런데 두 소스 다 공분산을
# 안 채워서 전부 0 이고, robot_localization 은 0 을 1e-9 로 올려 쓴다
# = 둘 다 "오차 0 인 완벽한 측정". 그래서 ekf.yaml 만으로는 라이다를
# 덜 믿게 만들 방법이 없다. 자세한 근거는
# src/odom_covariance_relay.cpp 상단 주석.
#
# ── 읽는 법 ────────────────────────────────────────────────────────
# sigma 는 표준편차다. **키우면 그 센서를 덜 믿는다.**
# 두 센서의 상대비가 배분을 정한다 — 절대값보다 비율을 보고 조절할 것.
# 가중치는 분산(sigma^2) 비례라서 **sigma 2 배 = 무게 4 배**다.
#
# bias 는 sigma 와 완전히 다른 것이다. sigma 는 "얼마나 흔들리나",
# bias 는 "얼마나 치우쳤나". **sigma 를 키워서 bias 를 가릴 수 없다.**
#
# ====================================================================
# 2026-08-26 실측 (실차, 정지 60 초, /cmd_vel 0)
#   ros2 run kau_localization imu_bias.py --secs 60
#
#   IMU  gyro z    평균 -0.000007 rad/s (-0.02 deg/min)  sigma 0.00474
#        accel x   평균 -0.0456 m/s^2                    sigma 0.1011
#        accel y   평균 -0.0132 m/s^2                    sigma 0.0878
#        수평 바이어스 0.0475 m/s^2 -> 장착 기울기 0.28 도  (양호)
#
#   라이다 twist vyaw  sigma 0.01319 rad/s
#          twist vx    sigma 0.01888 m/s
#          정지 60 초 누적: 위치 0.182 m, yaw +2.15 deg/min
#
#   -> **자이로가 라이다보다 요레이트에서 2.8 배 조용하다**
#      (sigma 0.00474 vs 0.01319). 게다가 정지 드리프트가
#      -0.02 vs +2.15 deg/min 으로 100 배 차이다.
#      아래 배분은 전부 이 실측에서 나왔다.
# ====================================================================
/**:
  ros__parameters:

    # ── 라이다 스캔매칭 오도메트리 (RPlidar C1 + Point-to-Line ICP) ──
    #
    # 실차에서 이 소스가 나쁜 이유가 세 가지로 확인됐다:
    #   1. 사람(지도에 없는 것)이 많아 포인트가 분산된다
    #   2. 맵 가장자리 펜스가 잘 안 찍힌다
    #   3. 가까운 2/3 만 찍히고 먼 공간은 인지가 약하다
    #
    # 셋 다 "ICP 가 미끄러진다" 로 나타난다. 그래서 느슨하게 잡는다.
    # 다만 **버리지는 않는다** — x/y 절대 위치를 주는 소스가 이것
    # 뿐이고, IMU 는 가속도를 두 번 적분하는 것 말고는 위치를
    # 원리적으로 만들 수 없다.
    laser:
      in_topic:  /odom/laser
      out_topic: /odom/laser_cov

      # 위치 [m]. 정지 60 초에 0.182 m 밀렸다. 주행 중 사람이 많으면
      # 더 밀리므로 실측보다 넉넉하게 잡는다.
      # 너무 키우면 EKF 가 절대 위치를 안 받아 드리프트만 쌓인다.
      sigma_xy_m: 0.15

      # ★ 방위 [rad] — **지금은 안 읽힌다.**
      #   ekf.yaml 에서 odom0_config 의 yaw 를 껐다. 절대 방위를
      #   ICP 에서 받지 않고 요레이트 수준에서만 섞는다
      #   (이유는 ekf.yaml 의 "yaw 를 왜 rate 로만 섞나" 참고).
      #   나중에 다시 켤 사람을 위해 값은 남겨 둔다.
      sigma_yaw_rad: 0.20

      # 전진 속도 [m/s]. 정지 실측 sigma 0.0189. ICP 를 dt 로 나눈
      # 값이라 주행 중에는 더 튄다. 실측의 3 배 정도로 잡는다.
      sigma_vx_ms: 0.06

      # ★ 횡속도 [m/s] — **비홀로노믹 구속** (2026-08-26 추가)
      #
      #   laser_odom_node.cpp 는 twist.linear.y 를 한 번도 안 쓴다.
      #   publish_odom() 이 linear.x 와 angular.z 만 채우므로 이 축은
      #   항상 정확히 0 이다. 그 0 을 EKF 에 측정으로 넣으면
      #   "이 차는 옆으로 안 미끄러진다" 는 뜻이 된다.
      #
      #   애커만 조향차에서 이건 참이고, **ax/ay 를 켜면서 필수가 됐다.**
      #   가속도 바이어스가 vy 로 적분돼 쌓이는 것을 막는 유일한 장치다
      #   (ekf.yaml 의 "ay 를 켜도 되는 조건" 참고).
      #
      #   0.05 m/s 는 타이어 슬립각을 감안한 값이다. 급선회에서 실제로
      #   옆으로 밀린다면 키운다. 0 에 가깝게 조이면 선회 중 필터가
      #   부자연스럽게 뻣뻣해진다.
      sigma_vy_ms: 0.05

      # ★ 요레이트 [rad/s] — **여기가 yaw 배분 손잡이다** (핵심)
      #
      #   정지 실측 sigma 0.01319. 주행 중 ICP 가 더 미끄러지므로
      #   3 배로 잡아 0.04.
      #
      #   아래 imu.sigma_vyaw_rads(0.005) 와의 분산비가 그대로 무게다:
      #     (0.04 / 0.005)^2 = 64  ->  IMU 98.5% : 라이다 1.5%
      #
      #   라이다에 1.5% 를 남긴 이유: 자이로 바이어스가 온도/시간에
      #   따라 천천히 흘러도 rate 수준에서 아주 느리게 당겨 준다.
      #   완전히 0 으로 만들면 자이로가 틀어질 때 되돌릴 게 없다.
      #
      #   라이다를 더 믿고 싶으면 **줄인다** (0.02 면 대략 84:16).
      sigma_vyaw_rads: 0.04

    # ── IMU (9축, /imu) ──
    #
    # 실기 드라이버는 각속도와 가속도만 채운다. orientation 은
    # 단위 쿼터니언 + orientation_covariance[0] = -1.0 ("값 없음") 이라
    # 절대 방위로 쓸 수 없다. 릴레이도 orientation 은 안 건드린다.
    imu:
      in_topic:  /imu
      out_topic: /imu/cov

      # 요레이트 [rad/s]. 정지 실측 sigma 0.00474 를 거의 그대로 쓴다.
      # 자이로는 바이어스가 -0.02 deg/min 로 사실상 없어서 실측값을
      # 부풀릴 이유가 없다.
      # laser.sigma_vyaw_rads(0.04) 의 1/8 -> 분산 1/64 -> 회전은
      # 사실상 IMU 가 끈다.
      sigma_vyaw_rads: 0.005

      # 가속도 [m/s^2]. 정지 실측 sigma ax 0.1011 / ay 0.0878.
      # 실측을 그대로 쓴다 — 바이어스는 아래에서 따로 빼므로 여기에
      # 여유를 섞어 넣을 필요가 없다.
      sigma_accel_ms2: 0.10

      # ── 바이어스 [측정값에서 그대로 뺀다] ──
      #
      # 2026-08-26 정지 60 초 실측. 재측정:
      #   ros2 run kau_localization imu_bias.py --secs 60
      # 보정이 먹었는지 확인:
      #   ros2 run kau_localization imu_bias.py --topic /imu/cov --secs 30
      #
      # ★ 이 값은 **장착이 바뀌면 반드시 다시 재라.** 가속도
      #   바이어스의 주 원인이 센서가 아니라 장착 기울기라서
      #   (1 도 = 0.171 m/s^2) IMU 를 떼었다 붙이면 값이 달라진다.
      #
      # ★ 바이어스는 온도/시간에 따라 조금씩 흔들린다. 상수로 빼는
      #   것은 완전한 해법이 아니라 큰 덩어리만 걷어내는 것이다.
      #   지금 수평 바이어스는 0.0475 m/s^2 (기울기 0.28 도) 로 작아서
      #   잔차도 작다.
      bias_ax_ms2: -0.0456
      bias_ay_ms2: -0.0132
      bias_vyaw_rads: -0.0000070

      # ── 자이로 적분 방위 (2026-08-26) ──
      #
      # 실기 IMU 에는 orientation 이 없어서, 릴레이가 바이어스를 뺀
      # 자이로 z 를 적분해 orientation 을 만들어 낸다. ekf.yaml 의
      # imu0_config 가 그 yaw 를 **절대 관측**으로 읽는다.
      #
      # 왜 필요한가: 절대 yaw 측정이 하나도 없으면 EKF 의 yaw 공분산이
      # 발산하고(실측 4.4 rad^2 = sigma 121 도), 커진 공분산이 라이다
      # **위치** 갱신과 교차공분산을 만들어 yaw 를 끌고 다닌다.
      # 실측으로 EKF yaw 가 자기 각속도와 부호까지 반대로 움직였다
      # (vyaw -0.55 deg/min 인데 각도는 +6.67 deg/min).
      # 자세한 근거는 ekf.yaml 의 "절대 yaw 는 반드시 하나 있어야 한다".
      #
      #   auto        orientation_covariance[0] < 0 일 때만 적분해서
      #               채운다 -> 실차는 적분, sim 은 Gazebo 참값 그대로
      #   integrate   항상 적분
      #   passthrough 안 건드림 (예전 동작)
      yaw_source: auto

      # 적분 방위의 신뢰도 [rad]. 0.02 rad = 1.15 도.
      #
      # 이 값의 역할은 "라이다 대비 얼마나 믿나" 가 아니다 — 이제
      # 절대 yaw 를 주는 소스가 이것 하나뿐이다. 진짜 역할은
      # **yaw 공분산을 묶어 두는 것**이다. 0.02 면 P[yaw,yaw] 가
      # 4e-4 rad^2 근처에 머물러서, 발산했을 때의 4.4 대비 1 만 분의 1
      # 이 된다. 위치 갱신이 yaw 를 끌고 다니던 경로가 그만큼 죽는다.
      #
      # 키우면 EKF 가 적분 방위를 느슨하게 따라가지만 공분산도 같이
      # 커져서 위 문제가 되살아난다. 0.05 rad 이상은 권하지 않는다.
      sigma_yaw_rad: 0.02

    # 원본이 이미 공분산을 채워 오면 덮지 않는다.
    #
    # ★ false 여야 sim 과 실차가 **같은 설정으로 각자 옳게** 동작한다.
    #   실측 (2026-08-25):
    #
    #     /odom/laser  pose.covariance          전부 0    (sim·실차 공통)
    #     /imu (sim)   angular_velocity_cov[8]  4e-08     <- Gazebo 가 채움
    #     /imu (실차)  angular_velocity_cov[8]  0         <- 드라이버가 안 채움
    #
    #   sim IMU 의 4e-08 은 sigma 0.0002 rad/s = 0.011 deg/s 로, Gazebo
    #   센서 노이즈 설정에서 나온 **정직한 값**이다. 위 0.005 rad/s 는
    #   실기 MEMS 자이로 기준이라 sim 에는 25배 비관적이다. true 로 두면
    #   sim 성능을 이유 없이 깎는다.
    #
    #   false 면 "0 인 것만 채운다" 가 되어 라이다는 항상 채워지고
    #   (sim·실차 모두 0), IMU 는 sim 에서 Gazebo 값이 살고 실차에서만
    #   위 값이 들어간다. 정확히 원하는 동작이다.
    #
    # ★ 바이어스 빼기는 이 스위치와 무관하게 **항상** 적용된다.
    #   sim 에서는 bias_* 를 0 으로 두면 되고, sim_overrides 가 아니라
    #   실차 값만 여기 적혀 있으므로 sim 에 올릴 때 주의할 것.
    #
    # true 로 두는 경우: 소스가 채운 값이 명백히 틀렸다고 판단해 강제로
    # 덮어써야 할 때뿐이다.
    overwrite_existing: false
