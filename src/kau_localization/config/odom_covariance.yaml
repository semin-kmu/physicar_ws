# ====================================================================
# 센서 신뢰도 — 이 파일이 EKF 신뢰도 배분의 유일한 손잡이다
#
# odom_covariance_relay 가 /odom/laser 와 /imu 에 아래 공분산을 채워서
# /odom/laser_cov, /imu/cov 로 다시 낸다. ekf.yaml 은 그 두 토픽을 본다.
#
# ── 왜 여기서 하나 ──────────────────────────────────────────────────
# robot_localization 에는 센서별 신뢰도 파라미터가 아예 없다.
# odom0_* 로 줄 수 있는 것은 _config / _differential / _relative /
# _queue_size / _rejection_threshold 뿐이고, **측정 신뢰도는 오직
# 메시지의 covariance 필드에서 온다.** 그런데 두 소스 다 공분산을
# 안 채워서 전부 0 이고, robot_localization 은 0 을 1e-9 로 올려 쓴다
# = 둘 다 "오차 0 인 완벽한 측정". 그래서 ekf.yaml 만으로는 라이다를
# 덜 믿게 만들 방법이 없다. 자세한 근거는
# src/odom_covariance_relay.cpp 상단 주석.
#
# ── 읽는 법 ────────────────────────────────────────────────────────
# sigma 는 표준편차다. **키우면 그 센서를 덜 믿는다.**
# 두 센서의 상대비가 배분을 정한다 — 절대값보다 비율을 보고 조절할 것.
# ====================================================================
/**:
  ros__parameters:

    # ── 라이다 스캔매칭 오도메트리 (RPlidar C1 + Point-to-Line ICP) ──
    #
    # 실차에서 이 소스가 나쁜 이유가 세 가지로 확인됐다:
    #   1. 사람(지도에 없는 것)이 많아 포인트가 분산된다
    #   2. 맵 가장자리 펜스가 잘 안 찍힌다
    #   3. 가까운 2/3 만 찍히고 먼 공간은 인지가 약하다
    #
    # 셋 다 "ICP 가 미끄러진다" 로 나타난다. 그래서 위치·방위를
    # 느슨하게 잡는다. 다만 **버리지는 않는다** — 절대 위치를 주는
    # 소스가 이것뿐이고, IMU 는 x/y 를 원리적으로 만들 수 없다.
    laser:
      in_topic:  /odom/laser
      out_topic: /odom/laser_cov

      # 위치 [m]. 10 cm 는 "ICP 가 평균 10 cm 미끄러진다" 는 뜻이다.
      # 사람이 많은 대회장에서 더 밀리면 0.15 ~ 0.20 까지 올린다.
      # 너무 키우면 EKF 가 절대 위치를 안 받아 드리프트가 쌓인다.
      sigma_xy_m: 0.10

      # 방위 [rad]. 0.05 rad = 2.9 도.
      # ekf.yaml 실측에서 /odom/laser 의 정지 드리프트가 -0.10 deg/min
      # 으로 IMU 만큼 깨끗했다. 위치보다는 방위를 믿어도 된다는 뜻이라
      # 위치 대비 상대적으로 조인 값이다.
      sigma_yaw_rad: 0.05

      # 전진 속도 [m/s]. ICP 를 미분해서 나오는 값이라 위치보다 잡음이
      # 크다. 넉넉히 준다.
      sigma_vx_ms: 0.20

      # 요레이트 [rad/s]. 이 축은 IMU 쪽이 훨씬 좋으므로 크게 잡아
      # 사실상 IMU 에 양보한다 (아래 imu.sigma_vyaw_rads 의 10배).
      # ekf.yaml 의 odom0_config 에서 vyaw 는 꺼져 있어 지금은 읽히지도
      # 않지만, 나중에 켜는 사람이 라이다 요레이트를 IMU 와 같은
      # 무게로 넣지 않도록 값으로 남겨 둔다.
      sigma_vyaw_rads: 0.20

    # ── IMU (9축, /imu) ──
    #
    # 실기 드라이버는 각속도와 가속도만 채운다. orientation 은
    # 단위 쿼터니언 + orientation_covariance[0] = -1.0 ("값 없음") 이라
    # 절대 방위로 쓸 수 없다. 릴레이도 orientation 은 안 건드린다.
    #
    # 자이로는 sim/실기 모두 진짜 측정값이고 실측 바이어스가
    # +0.01 deg/min 로 깨끗하다 (ekf.yaml 주석). 그래서 라이다보다
    # 확실히 단단하게 잡는다 — 이것이 "라이다 신뢰도를 낮추고 IMU 와
    # 블렌딩" 의 실체다.
    imu:
      in_topic:  /imu
      out_topic: /imu/cov

      # 요레이트 [rad/s]. 0.02 rad/s = 1.15 deg/s.
      # laser.sigma_vyaw_rads(0.20) 의 1/10 이라 회전은 IMU 가 끈다.
      sigma_vyaw_rads: 0.02

      # 가속도 [m/s^2]. **2026-08-25 부터 쓰인다** — ekf.yaml 의
      # imu0_config 에서 ax/ay 를 켰다 (관성 6축 중 two_d_mode 하에서
      # 살아 있는 축 전부).
      #
      # 0.30 m/s^2 는 일부러 넉넉한 값이다. 가속도는 두 번 적분되므로
      # 바이어스 b 가 t 초 뒤 0.5*b*t^2 의 위치 오차가 된다 —
      # b=0.05 m/s^2 면 10 초에 2.5 m 다. 라이다가 아무리 나빠도
      # 이것보다는 나쁘지 않으므로, 가속도는 "가속/감속 순간 속도
      # 추정을 앞당기는" 보조로만 쓰고 위치를 끌게 두지 않는다.
      #
      # ★ 실차 바이어스는 센서보다 **중력 제거**에서 온다. 실기
      #   드라이버가 orientation 을 단위 쿼터니언(완전 수평)으로 두는데,
      #   장착이 δ 도 기울면 g*sin(δ) 가 ax/ay 에 남는다 (1 도 =
      #   0.17 m/s^2). 실차 배포 전에 반드시 재라:
      #
      #     scripts/imu_bias.py --secs 60
      #
      #   스크립트가 측정한 바이어스와 노이즈로 이 값을 얼마로 둘지,
      #   바이어스 보정이 필요한지 알려 준다.
      sigma_accel_ms2: 0.30

    # 원본이 이미 공분산을 채워 오면 덮지 않는다.
    #
    # ★ false 여야 sim 과 실차가 **같은 설정으로 각자 옳게** 동작한다.
    #   실측 (2026-08-25):
    #
    #     /odom/laser  pose.covariance          전부 0    (sim·실차 공통)
    #     /imu (sim)   angular_velocity_cov[8]  4e-08     <- Gazebo 가 채움
    #     /imu (실차)  angular_velocity_cov[8]  0         <- 드라이버가 안 채움
    #
    #   sim IMU 의 4e-08 은 sigma 0.0002 rad/s = 0.011 deg/s 로, Gazebo
    #   센서 노이즈 설정에서 나온 **정직한 값**이다. 아래 0.02 rad/s 는
    #   실기 MEMS 자이로 기준이라 sim 에는 1000배 비관적이다. true 로 두면
    #   sim 성능을 이유 없이 깎는다.
    #
    #   false 면 "0 인 것만 채운다" 가 되어 라이다는 항상 채워지고
    #   (sim·실차 모두 0), IMU 는 sim 에서 Gazebo 값이 살고 실차에서만
    #   아래 값이 들어간다. 정확히 원하는 동작이다.
    #
    # ★ 나중에 laser_odom 이 ICP 잔차 기반 동적 공분산을 내기 시작하면
    #   이 값 그대로 두면 그쪽이 자동으로 이긴다.
    #
    # true 로 두는 경우: 소스가 채운 값이 명백히 틀렸다고 판단해 강제로
    # 덮어써야 할 때뿐이다.
    overwrite_existing: false
