# 속도 제어 parameter (곡률 기반 목표속도 + PID)
#
# 단위: 길이 cm / 곡률 1/cm / 속도 m/s
#
#   kappa_win = 전방 window 의 최대 |kappa|
#   v_want    = law(kappa_win) -> [v_min, v_max] -> EMA        (대기 중에도 상시)
#   v_ref     = 출발 허가 전이면 0, 허가 후엔 v_want 로 가감속 제한
#   /speed    = clamp(v_ref + PID(v_ref - v_meas), 0, v_max)
#
# 직선이면 v_max, 곡률이 클수록 낮아진다.
#
# **주행 공간이나 차량이 바뀌면 다시 잡아야 한다.**

speed_controller:
  ros__parameters:

    # --- 경로 입력 ---
    # ★ 경로 소스 설정은 여기 없다. config/path_source.yaml 한 곳이다.
    #   두 제어기가 그 파일을 같이 받으므로 모드를 바꾸려면
    #   path_source.yaml 의 path.mode 한 줄만 고치면 된다.

    # --- 인터페이스 (소스 공통) ---
    map_frame: "map"
    base_frame: "base_footprint"

    control_hz: 50.0
    tf_timeout: 0.2
    cte_abort_cm: 200.0
    goal_tol_cm: 10.0

    # --- 차량 제원 ---
    # kappa_max(= 기하 최소회전반경) 계산에 쓴다. steer 쪽과 같은 값일 것.
    vehicle:
      wheelbase_cm: 18.0
      max_steer_deg: 20.0
      rear_axle_offset_cm: -9.0

    # --- 목표속도 ---
    speed:
      # ★ 초기 실차 시험용 저속 세팅 (2026-08-25).
      #   트랙 주 코너가 R 63~65 cm 라 v_min 이 코너 속도를 사실상 결정한다.
      v_min: 0.3
      v_max: 0.5                        # 하드웨어 상한은 3.0
      # window = [look_min, max(look_k * v, look_min + min_span)]
      #          look_k = look_max / v_max = 50 / 0.5 = 100 cm per (m/s)
      #
      # 즉 상한이 **전방 1.0 초**다. v 0.2 -> 20 cm(바닥 30), 0.5 -> 50 cm.
      # ★ v_max 를 바꾸면 look_max 도 같이 바꿔야 1 초가 유지된다.
      #
      # 1 초 근거: 이 속도대에선 제동거리(5 cm)가 아니라 ema_tau(0.4 s) 수렴이
      # 지평을 정한다. R 63 cm 코너 접근 시뮬에서 진입 초과속 +0.004 m/s.
      # 하한 10 cm 는 범퍼 바로 앞 곡률까지 본다는 뜻 (window 폭 확보용).
      # v < 0.3 m/s 에선 min_span 바닥(30 cm)이 지배 -> Ld 와 같은 거리를 본다.
      look_min_cm: 10.0                 # 곡률 탐색 window 하한
      look_max_cm: 50.0                 # v_max 에서의 window 상한 (= 1.0 s)
      min_span_cm: 20.0                 # window 최소 폭 (저속 퇴화 방지)
      # v_min 이 나오는 곡률 = margin * kappa_max.
      #   1.0 -> R 49.45 cm (= 차량 최소회전반경). 여기서만 최저속.
      #   0.8 -> R 61.8 cm   0.6 -> R 82.4 cm
      #
      # **내릴수록 더 완만한 곡선에서 감속한다** (방향 헷갈리기 쉬움).
      # 1.0 인 이유: 이 속도대의 a_lat 은 0.081 m/s^2 로 실제 마찰한계의
      # 수% 라 안전여유가 무의미하고, 트랙 주 코너 R 63~65 cm 에서
      # 불필요하게 v_min 까지 떨어지던 것을 0.23 m/s 로 올린다.
      margin: 1.0
      use_sqrt_law: true                # true: 등횡가속도, false: 선형 보간
      # 주행 중에는 속도 폭이 0.3 m/s 뿐이라 이 두 값이 **거의 안 걸린다**
      # (ema_tau 가 더 느리다). 다만 accel_max 는 **출발 순간에 걸린다**:
      # 출발 허가 전 v_ref 가 0 으로 묶여 있다가 허가와 함께 v_want 까지
      # 올라가는데, 그 기울기를 정하는 것이 이 값이다.
      #
      #   0 -> 0.5 m/s 도달 시간 = v_max / accel_max = 0.5 / 1.5 = 0.33 s
      #
      # ★ 출발이 거칠면 여기를 내린다 (0.5 로 두면 1.0 s). 내릴수록 주행 중
      #   가속에도 걸리기 시작하므로 코너 탈출이 같이 둔해진다.
      accel_max: 1.5                    # m/s^2, 목표속도 증가율 상한 (= 출발 가속)
      decel_max: 2.0                    # m/s^2, 감속은 넉넉히 허용
      ema_tau: 0.4                      # s, 목표속도 EMA 시상수 (0 이면 끔)

      # --- 속도 피드백 ---
      # ★ 오도메트리 노드가 아직 없다. 노드가 생기면 아래 topic 만 바꾸고
      #   require_feedback 을 true 로 올린다 (타입은 nav_msgs/Odometry,
      #   twist.twist.linear.x 를 읽는다).
      #
      # require_feedback
      #   false : 피드백이 없거나 stale 이면 PID 보정 없이 v_ref 만 발행.
      #           지금은 이 상태여야 주행 시험을 할 수 있다.
      #   true  : 피드백이 없으면 즉시 정지. 오도메트리가 붙은 뒤의 운용값.
      feedback_topic: "/odometry/filtered"   # /odom 으로 바꿔야됨 저런 토픽 존재안함. 
      feedback_timeout: 0.2             # s, 이보다 오래되면 stale
      require_feedback: false           # 실차에선 True 로 바꿔야됨. 

    # --- 출발 게이트 (신호등) ---
    # 초록불이 되기 전에는 /speed 를 0 으로 묶는다.
    #
    #   초기값 · 미수신 · false -> 0 발행
    #   true 1회 수신           -> latch. 이후 값은 로깅만 하고 판정에서 제외
    #
    # latch 하는 이유: start_signal_detector 가 재시작하면 그쪽 latch 가 풀려
    # false 를 다시 발행한다. 그대로 따르면 트랙 한복판에서 멈춘다.
    #
    # 미수신 timeout 은 두지 않는다. 초기값이 false 라 "안 오면 안 간다" 가
    # 이미 기본 동작이다 (화이트리스트 판정).
    start_gate:
      # ★ kau_state_machine 이 /state_machine/speed_limit 을 내기 시작하면
      #   이 토픽을 그쪽으로 갈아끼운다 (docs/01 계약 14). 한시적 직결이다.
      permission_topic: "/perception/start_permission"
      # false 로 두면 게이트 없이 곧바로 달린다. **신호등 없이 주행부만
      # 시험할 때만** 쓴다. 실주행·대회에서는 반드시 true.
      required: true

    # --- PID ---
    # v_ref 를 피드포워드로 깔고 오차분만 보정하므로 게인은 작게 시작한다.
    # 피드백이 붙기 전까지는 이 값들이 쓰이지 않는다.
    # 차량 테스트 후 적용 예정.
    # physicar_driver_node 가 있어서 ki 만 조절하면 된다.. 
    pid:
      kp: 0.5
      ki: 0.5
      kd: 0.0
      i_max: 0.5                        # 적분항 상한 [m/s]. windup 방지
      out_max: 0.5                      # 보정량 상한 [m/s]
