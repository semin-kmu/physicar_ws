# 조향 제어 parameter (Pure Pursuit)
#
# 단위: 길이 cm / 각도 deg   (ROS 경계에서만 m, rad 로 변환)
#
# 기본값 출처
#   차량 제원        대회측 회신 (확정) + physicar driver_params.yaml
#   Pure Pursuit     KAU_AMET_Test 시뮬 검증본의 레퍼런스 튜닝값
#
# **주행 공간이나 차량이 바뀌면 다시 잡아야 한다.**

steer_controller:
  ros__parameters:

    # --- 인터페이스 ---
    # 경로 우선순위. 매 tick 위에서부터 훑어 "쓸 수 있는" 첫 번째를 따라간다.
    #   1) local   map 프레임. TF 필요
    #   2) global  map 프레임. TF 필요
    #   3) lane    base 프레임. TF 없이 돈다 -> 측위가 끊겨도 살아남는다
    path_topic: "/path/local"           # 1 순위 (kau_msgs/KauPath)
    fallback_path_topic: "/path/global" # 2 순위
    lane_path_topic: "/lane/center"     # 3 순위. "" 로 두면 안 쓴다
    map_frame: "map"
    base_frame: "base_footprint"
    pose_source: "tf"                   # 1·2 순위용. tf | identity
    lane_pose_source: "identity"        # 3 순위용. lane 경로는 차량 프레임
    lane_frame: "base_link"             # lane_detection 의 path_frame_id 와 일치
    path_latched: false                 # 발행측 durability 와 맞출 것
    fallback_path_latched: true
    lane_path_latched: false
    speed_topic: "/speed"               # Ld 계산에 쓸 현재 속도 명령

    control_hz: 50.0
    tf_timeout: 0.2                     # s, TF 가 이보다 오래되면 그 순위는 못 씀
    path_timeout: 1.0                   # s, 1 순위가 이보다 오래되면 아래로
    fallback_path_timeout: 0.0          # s, 0 = 만료 없음 (latched 1 회 발행 대비)
    lane_path_timeout: 0.5              # s, lane 은 14 Hz 라 짧게
    cte_abort_cm: 200.0                 # cm, 발산 판정 -> 조향 0
    goal_tol_cm: 10.0                   # cm, 개곡선 종점 도달 판정

    # --- 차량 제원 ---
    vehicle:
      wheelbase_cm: 18.0                # 확정. driver_params.yaml 과 일치할 것
      max_steer_deg: 20.0               # 확정. 하드웨어 한계
      # Pure Pursuit 기준점(후륜축)이 base_frame 원점에서 떨어진 종방향 거리.
      # PhysiCar URDF 는 base_footprint 를 휠베이스 중앙에 두므로 -wheelbase/2.
      # 0 으로 두면 코너에서 계속 안쪽으로 파고든다.
      # speed_controller.yaml 의 같은 값과 반드시 일치시킬 것.
      rear_axle_offset_cm: -9.0

    # --- Pure Pursuit ---
    # 튜닝 대상은 사실상 Ld 하나. 시뮬 탐색 범위는
    #   k_v 0.3~1.0 s / ld_min 30~60 cm / ld_max 150 cm
    controller:
      k_v: 0.5                          # s, Ld = k_v * v
      ld_min_cm: 30.0
      ld_max_cm: 175.0

    # --- 시각화 ---
    # RViz 는 KauPath 를 못 그리므로 nav_msgs/Path 로 분리 발행한다.
    viz:
      enabled: true
      samples_per_seg: 20
