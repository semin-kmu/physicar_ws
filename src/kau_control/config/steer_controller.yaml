# 조향 제어 parameter (Pure Pursuit)
#
# 단위: 길이 cm / 각도 deg   (ROS 경계에서만 m, rad 로 변환)
#
# 기본값 출처
#   차량 제원        대회측 회신 (확정) + physicar driver_params.yaml
#   Pure Pursuit     KAU_AMET_Test 시뮬 검증본의 레퍼런스 튜닝값
#
# **주행 공간이나 차량이 바뀌면 다시 잡아야 한다.**

steer_controller:
  ros__parameters:

    # --- 경로 입력 ---
    path:
      # 경로 소스 선택. 매 tick 프리셋 순서대로 훑어 "쓸 수 있는" 첫 번째를
      # 따라간다. 프리셋에 없는 소스는 구독조차 하지 않는다.
      #
      #   normal      local -> global -> lane   평상시 주행
      #   steer_test  global 만                 조향 제어기 시험
      #   lane_only   lane 만                   차선 추종 단독 (lane_follow)
      #
      # "쓸 수 있다" = 받아뒀고 + timeout 안에 갱신됐고 + pose 를 얻을 수 있다.
      # 모르는 이름을 주면 기동을 접는다 (조용히 돌면 원인을 못 찾는다).
      mode: "normal"

      sources:
        local:
          topic: "/path/local"          # kau_msgs/KauPath
          latched: false                # 발행측 durability 와 맞출 것
          timeout: 1.0                  # s, 넘으면 다음 소스로
          pose_source: "tf"             # tf | identity
          frame: ""                     # identity 일 때만. 비우면 base_frame

        global:
          topic: "/path/global"
          latched: true
          # global 발행자가 죽으면 이 시간 뒤 다음 소스로 내려간다.
          # ★ global_path.launch.py 를 반드시 rate>0 (기본 1 Hz) 로 띄울 것.
          #   rate:=0 (1 회 발행) 이면 정상 상태에서도 이 시간 뒤 만료된다.
          timeout: 3.0                  # s, 0 이면 만료 없음
          pose_source: "tf"
          frame: ""

        lane:
          topic: "/lane/center"
          latched: false
          timeout: 0.5                  # s, lane 은 14 Hz 라 짧게
          # lane 도 map 프레임으로 받는다. kau_lane_detection 이
          # path_frame_id=map 으로 발행하고 있어 그쪽 설정을 그대로 쓴다.
          # 대신 lane 도 TF 를 타므로 측위가 끊기면 세 소스가 함께 정지한다
          # (의도된 선택).
          pose_source: "tf"
          frame: "base_link"            # pose_source=identity 일 때만 쓰임

    # --- 인터페이스 (소스 공통) ---
    map_frame: "map"
    base_frame: "base_footprint"
    speed_topic: "/speed"               # Ld 계산에 쓸 현재 속도 명령

    control_hz: 50.0
    tf_timeout: 0.2                     # s, TF 가 이보다 오래되면 그 소스는 못 씀
    cte_abort_cm: 200.0                 # cm, 발산 판정 -> 조향 0
    goal_tol_cm: 10.0                   # cm, 개곡선 종점 도달 판정

    # --- 차량 제원 ---
    vehicle:
      wheelbase_cm: 18.0                # 확정. driver_params.yaml 과 일치할 것
      max_steer_deg: 20.0               # 확정. 하드웨어 한계
      # Pure Pursuit 기준점(후륜축)이 base_frame 원점에서 떨어진 종방향 거리.
      # PhysiCar URDF 는 base_footprint 를 휠베이스 중앙에 두므로 -wheelbase/2.
      # 0 으로 두면 코너에서 계속 안쪽으로 파고든다.
      # speed_controller.yaml 의 같은 값과 반드시 일치시킬 것.
      rear_axle_offset_cm: -9.0

    # --- Pure Pursuit ---
    # 튜닝 대상은 사실상 Ld 하나. 시뮬 탐색 범위는
    #   k_v 0.3~1.0 s / ld_min 30~60 cm / ld_max 150 cm
    controller:
      k_v: 0.5                          # s, Ld = k_v * v
      ld_min_cm: 30.0
      ld_max_cm: 175.0

    # --- 시각화 ---
    # RViz 는 KauPath 를 못 그리므로 nav_msgs/Path 로 분리 발행한다.
    viz:
      enabled: true
      samples_per_seg: 20

    # --- 디버깅 GUI (kau_gui) ---
    # 제어 루프가 이미 구하는 값(clamp 전후 조향각, Ld, 추종오차)을 그대로
    # 내보낸다. 계산이 늘지 않고, 구독자가 없어도 제어에 영향이 없다.
    # QoS 는 BEST_EFFORT 고정 (재전송 비용을 제어 tick 에 얹지 않는다).
    debug:
      enabled: true
      topic: "/debug/steer"
