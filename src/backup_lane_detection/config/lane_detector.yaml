# backup_lane_detector
#
# 거리는 전부 후륜축 원점 기준 [m]. 좌측 +.
# 노드 이름이 바뀌어도 끊기지 않도록 /**: 와일드카드를 쓴다.

/**:
  ros__parameters:

    # ================================================================
    # 입출력
    # ================================================================
    # compressed 는 전송량이 적은 대신 imdecode 비용이 붙는다.
    # 같은 호스트에서 raw 가 더 쌀 수 있으므로 실측 후 바꿀 수 있게 연다.
    input_topic: "/camera/image_raw/compressed"
    output_topic: "/backup/lane/geometry"
    debug_image_topic: "/backup/lane/debug_image"
    publish_debug_image: false          # 실주행에서는 false

    # ================================================================
    # BEV
    # ================================================================
    # 전체 warpPerspective 를 하지 않는다. 지면 z=0 호모그래피 H 를
    # 기동 시 1 회 만들고, 검출된 점(수백 개)에만 적용한다.
    #   H_ground->img = K * [r1 r2 t],  H_img->ground = 그 역행렬
    #   r1,r2 = 틸트 회전행렬의 1/2 열, t = (0,0,camera_height)
    # 전체 warp 는 640x480 기준 14.8 ms 였고, 슬라이딩 윈도우를 BEV 에서
    # 돌릴 때만 필요했다. 우리는 영상 공간에서 점을 뽑으므로 대상이 없다.
    #
    # 아래는 사람이 보는 디버그 전용이며 실주행에서는 켜지 않는다.
    publish_bev_debug: false
    bev_debug_width: 240
    bev_debug_height: 320

    # ================================================================
    # 카메라 기하
    # ================================================================
    # 드라이버가 이미 왜곡보정한 영상이 들어온다 (D 가 전부 0).
    # true 로 두면 이중 보정으로 기하가 통째로 틀어진다.
    undistort: false

    image_width: 480
    image_height: 360
    fx: 261.558954
    fy: 261.558954
    cx: 231.819776
    cy: 169.603322

    camera_height_m: 0.1465
    # /camera/tilt 로 기동 시 1회만 발행하고 끝. 주행 중 움직이지 않는다.
    # 움직이면 호모그래피와 행별 커널 폭을 매 프레임 다시 만들어야 한다.
    #
    # 10 deg 는 지평선이 화면 안(행 122)에 들어오는 대신 원거리 제한이
    # 없어진다. 대가는 해상도다 -- 1.52 m 에서 4.62 cm/px (36.5 deg 는 3.44).
    camera_tilt_deg: 10.0
    tilt_bias_deg: 0.284              # 광학 pitch 실측편차
    publish_tilt_on_start: true
    tilt_topic: "/camera/tilt"
    # pan 은 쓰지 않는다. 구독도 발행도 하지 않는다.
    use_camera_pan: false

    # 카메라 접지점 -> 후륜축 [m].
    # path_x_offset 0.105 (접지점->base_footprint) + 0.090 (base_footprint->후륜축)
    camera_to_rear_axle_m: 0.195

    # ================================================================
    # ROI  (틸트 10 deg / 실차 cy 169.6 기준)
    # ================================================================
    # 지평선이 행 122 에 있다. 그 위는 배경(하늘/벽/나무)이므로
    # ROI 상단을 지평선 아래로 자른다. 마진 18 행은 틸트 오차 +-4 deg
    # 에 해당한다 -- 가감속 시 서스펜션 pitch 도 여기서 흡수된다.
    #
    # 행 140 = 후륜축 2.39 m,  행 250 = 후륜축 0.48 m.  110 행 (31 %).
    roi_row_min: 140
    roi_row_max: 250

    # 검출 밴드 [m, 후륜축]. 이 밖의 점은 버린다.
    # 2.0 m 를 넘으면 선폭 11 px, 종방향 8.5 cm/px 라 신뢰할 수 없다.
    detect_min_m: 0.45
    detect_max_m: 2.00

    # ================================================================
    # 흰선 추출 -- 조명 불변 top-hat
    # ================================================================
    # 절대 밝기 임계(예전 white_hls_lo L>=205)는 쓰지 않는다.
    # 전역 조명이 변하면 흰선이 임계 위아래를 넘나든다.
    #
    # top-hat 은 커널보다 넓은 배경 밝기를 전부 빼므로 가산성 조명
    # 변화에 불변이고, 뒤의 임계를 고정값으로 둘 수 있다.
    tophat_threshold: 30              # top-hat 출력 임계 [0-255]
    saturation_max: 60                # max(B,G,R)-min(B,G,R) 상한. 노란선/잔디/주황콘 배제
    lane_width_m: 0.075               # 흰선 실폭. 행별 커널 폭 유도에 쓴다
    tophat_kernel_ratio: 3.0          # 커널 폭 = 그 행의 선폭 px * 이 값

    # 급코너에서 차선은 영상에서 가로로 눕는다. 수평 커널만 쓰면
    # 그 구간을 통째로 놓친다 (kau_lane_detection 실패 프레임 73 장 중
    # 59 장이 차선 방향 45 deg 미만이었다).
    # 수평/수직 top-hat 의 픽셀별 max 를 쓴다. van Herk 라 2 패스여도 싸다.
    tophat_bidirectional: true

    # ROI 를 몇 스트립으로 나눌지. 경계는 선폭이 등비로 늘도록 잡는다.
    # 4 는 스트립당 폭 오차 약 1.5 배 -- run_width_tol [0.5, 2.0] 안이다.
    tophat_strips: 4

    # 곱셈성 조명 변화까지 잡을 때만 켠다. 비용이 붙는다.
    use_clahe: false
    clahe_clip: 2.0
    clahe_grid: 8

    # 형태학 정리
    morph_open: 2
    morph_close: 3

    # ================================================================
    # 점 추출 -- 런 + 서브픽셀 센트로이드
    # ================================================================
    # 슬라이딩 윈도우 argmax 는 1 px 양자화가 그대로 잡음이 된다.
    # 런 센트로이드는 1/sqrt(12N) px 이고 윈도우 탐색이 없어 더 싸다.
    #
    # 행 런(세로에 가까운 차선) + 열 런(가로에 가까운 차선) 둘 다 뽑아
    # 합친다. 45 deg 부근은 양쪽에 잡히며 런 폭이 1.41 배가 되므로
    # tol_hi 2.0 안에 들어온다. 중복점은 지면좌표 5 mm 격자로 병합한다.
    run_scan_rows: true
    run_scan_cols: true
    run_merge_grid_m: 0.005

    run_width_tol_lo: 0.5             # 허용 런 폭 = 기대 선폭 * [lo, hi]
    run_width_tol_hi: 2.0
    min_run_pixels: 3
    row_step: 1                       # 1 이면 모든 행
    col_step: 2                       # 열 스캔은 2 열마다 (밀도 충분)

    # ================================================================
    # 직선 피팅 -- IRLS (RANSAC 아님)
    # ================================================================
    # RANSAC 은 같은 입력에 다른 해가 나와 프레임 간 무상관 잡음이 된다.
    # 이전 프레임 해를 초기값으로 한 IRLS 는 결정적이고 시간적으로 연속이다.
    irls_iterations: 4
    irls_huber_delta_m: 0.02
    min_points_per_line: 8
    seed_from_previous: true

    # ================================================================
    # 변곡점
    # ================================================================
    # 단일 임계면 20 deg 근처에서 매 프레임 뒤집혀 플래너 모드가 튄다.
    inflection_enter_deg: 20.0
    inflection_exit_deg: 15.0
    inflection_residual_m: 0.03       # 이 잔차를 넘어야 곡선으로 본다
    min_transition_points: 4          # 전환구간 점이 이보다 적으면 arc_length 신뢰 불가

    # ================================================================
    # 필터 -- 예측 보정
    # ================================================================
    # 자차 운동을 예측이 처리하므로 지연 없이 긴 시상수를 쓸 수 있다.
    # use_motion_prediction 을 끄면 순수 EMA 로 떨어지고 지연이 생긴다.
    use_motion_prediction: true
    speed_topic: "/speed"
    steer_topic: "/steering"
    wheelbase_m: 0.18

    filter_q_lateral: 0.0004          # 프로세스 잡음 [m^2]
    filter_q_heading: 0.0003          # [rad^2]
    filter_r_lateral: 0.0025          # 측정 잡음 [m^2]
    filter_r_heading: 0.0020          # [rad^2]

    # 이상치 게이트. 이 값을 넘는 측정은 버린다.
    gate_lateral_m: 0.12
    gate_heading_rad: 0.35

    # ================================================================
    # 유효 판정 히스테리시스
    # ================================================================
    valid_on_frames: 2
    valid_off_frames: 3

    # 트랙 반폭 [m]. 한쪽 차선만 보일 때 중앙선 복원에 쓴다.
    track_half_width_m: 0.35

    # ================================================================
    # 로그
    # ================================================================
    log_period_s: 2.0
