# backup_speed_controller
#
# 기하 판단 없음 -- 경로의 곡률만 본다.
# 거리는 후륜축 원점 기준 [m].

/**:
  ros__parameters:

    path_topic: "/backup/path"
    permission_topic: "/perception/start_permission"
    output_topic: "/speed"
    debug_topic: "/backup/debug/speed"
    publish_debug: true

    control_hz: 50.0                  # 플랫폼 계약 >= 50 Hz
    path_timeout_s: 0.4

    # ================================================================
    # 속도 프로파일
    # ================================================================
    # V_max 는 신뢰 검출거리가 정한다:
    #   1.0 m -> 1.32 / 1.2 -> 1.39 / 1.4 -> 1.46 / 1.6 -> 1.50
    # 틸트 10 deg 는 1.52 m 에서 종방향 4.62 cm/px 라 검출거리가
    # 짧아질 수 있다. 실측 전까지 보수적으로 둔다 (설계문서 16-3).
    v_max: 1.40
    v_min: 0.50
    a_accel: 1.5                      # [m/s^2]
    a_decel: 0.5                      # [m/s^2]

    # 50 Hz (tick 20 ms) 기준 레이트 리밋. a_* 에서 유도되므로
    # 코드가 계산한다. 여기 값은 상한 방어용이다.
    max_accel_step: 0.030             # [m/s] = 1.5 * 0.02
    max_decel_step: 0.010             # [m/s] = 0.5 * 0.02

    # ================================================================
    # 곡률 기반 목표속도
    # ================================================================
    #   v_curve  = sqrt(a_lat_max / max|kappa|)
    #   v_target = clamp( min(v_max, v_curve), v_min, v_max )
    #
    # a_lat_max 는 미측정이다. 정상원 선회 반경 축소 실험으로 확정한다.
    # 1.64 m/s^2 아래로 나오면 v_max 를 낮춰야 한다.
    a_lat_max: 3.0
    preview_m: 1.60                   # 전방 이 거리까지의 max|kappa| 를 본다

    # ================================================================
    # 감속 개시
    # ================================================================
    #   d_brake = (v^2 - v_corner^2)/(2*a_decel) + v*t_lat
    #   corner_entry_s <= d_brake  ->  감속 개시
    t_lat_s: 0.10

    # ================================================================
    # 게이트 (우선순위 순)
    # ================================================================
    # 1. permission false            -> 0
    # 2. stop_request                -> 0 으로 감속
    # 3. kappa_saturated             -> v_min (조향이 포화라 속도로 넘어온다)
    # 4. lost_state == LOST_BOTH     -> v_min, lost_hold_s 초과 시 0
    # 5. path timeout                -> 0
    require_start_permission: true
    lost_hold_s: 0.6                  # v_min 0.5 로 0.30 m 주행, 횡변위 8.9 cm

    # ================================================================
    # 모션 보상
    # ================================================================
    use_dead_reckoning: true
    max_dead_reckon_s: 0.30

    # ================================================================
    # 종료 안전
    # ================================================================
    # 0 을 한 번 내고 바로 죽으면 DDS 가 전송을 끝내지 못한다.
    # SIGKILL 에는 무력하므로 차량 측 타임아웃 유무를 별도 확인해야 한다.
    shutdown_zero_count: 3
    shutdown_zero_interval_ms: 20
    shutdown_linger_ms: 200

    log_period_s: 2.0
