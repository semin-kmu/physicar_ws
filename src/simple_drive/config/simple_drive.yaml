# ====================================================================
# simple_drive
#
# 밴뱅 조향 + 타이머 회피만으로 도는 최소 주행 스택.
# 인지는 backup_* 를 그대로 쓴다 -- 이 파일에 인지 파라미터는 없다.
#
# 거리 원점은 후륜축 [m], 각은 deg 입력 / rad 출력, 좌측 + 이다.
#
# ★ 이 스택을 띄울 때 backup_path_planner / backup_speed_controller /
#   backup_steer_controller 는 반드시 꺼야 한다. /speed, /steering 을
#   두 곳에서 쏘면 값이 섞여 차량에 간다.
# ====================================================================

simple_decision:
  ros__parameters:

    path_topic: "/backup/lane/path"
    left_topic: "/backup/lane/left"
    right_topic: "/backup/lane/right"
    obstacle_topic: "/backup/perception/obstacles"
    permission_topic: "/perception/start_permission"
    steer_topic: "/simple/cmd_steer_deg"
    speed_topic: "/simple/cmd_speed"
    debug_topic: "/simple/debug"
    state_topic: "/simple/state"
    publish_debug: true

    control_hz: 50.0
    path_timeout_s: 0.4         # 차선검출 ~12 Hz. 5 프레임 놓치면 정지
    obstacle_timeout_s: 0.5

    # ================================================================
    # 차선추종 밴뱅
    # ================================================================
    # /backup/lane/path 는 "노란 중앙선" 이다 (center_source: yellow).
    # 차로 폭은 중앙선 중심 <-> 흰선 중심 0.317 m, 차 폭 0.205 m 라
    # 중앙선 위에 있을 때 편측 여유가 0.317 - 0.1025 = 0.21 m 다.
    #
    # 전타(20 deg)의 선회반경 R = 0.18/tan(20) = 0.4945 m 이고, 그때
    # 차체가 쓸고 가는 폭은 0.248 m 라 도로 폭(0.634 m) 안에 들어간다.
    # 전타를 유지했을 때 0.19 m 밀려나기까지 걸리는 시간은
    # v=0.45 에서 약 1.0 초 -- 50 Hz 제어의 50 tick 이다. 밴뱅이
    # 되돌릴 시간은 충분하다는 근거가 이것이다.
    max_steer_deg: 20.0

    # 전방 몇 m 지점의 횡오차를 볼 것인가.
    #
    # ★ 이 값이 밴뱅의 실질 민감도를 정한다. 곡률 R 인 경로에서
    #   lookahead 횡오차는
    #
    #       e ~= Ld^2 / (2R)
    #
    #   라 Ld 에 제곱으로 붙는다. enter_m 0.04 기준 발동 경계:
    #
    #     Ld=0.50 ->  R=0.5:0.250  R=1.0:0.125  R=2.0:0.063  R=3.0:0.042
    #     Ld=0.28 ->  R=0.5:0.078  R=1.0:0.039  R=2.0:0.020  R=3.0:0.013
    #
    #   Ld=0.50 이면 R=3 m 짜리 거의 직선에서도 임계를 넘어 전타가
    #   나간다 -- 임계값이 사실상 무의미해진다. 실기동(2026-08-26)에서
    #   첫 직선 구간에 멀리 있는 코너를 보고 바로 전타를 준 것이 이것이다.
    #
    #   0.28 은 후륜축 -> 앞범퍼 0.230 m 바로 바깥이다. "곡률이 차 바로
    #   앞에 왔을 때 꺾는다" 를 기하로 옮긴 값이고, R<=1.0 m 인 실제
    #   코너에서만 발동한다.
    lookahead_m: 0.28
    # 검출 근거가 닿는 거리(valid_length) 밖은 외삽이라 쫓지 않는다.
    valid_length_margin_m: 0.05
    samples_per_seg: 32         # 호길이 LUT 해상도. 64 에서 오차 < 1 mm

    # --- 흰선 폴백 ---
    # 회피로 전타를 주면 카메라 방위가 20 도 넘게 돌아 노란 중앙선이
    # 화각 밖으로 나간다. 그때 /backup/lane/path 는 0 Hz 로 끊기지만
    # 좌/우 흰선은 14 Hz 로 계속 나온다 (2026-08-26 실측). 흰선을
    # 안쪽으로 밀어 중앙선을 복원해 계속 달린다.
    #
    # lane_detector.yaml 의 lane_width_cm 31.7 과 반드시 같은 값이다.
    lane_width_m: 0.317
    # 너무 짧은 흰선 조각에서 뽑은 방위는 잡음이다.
    white_min_valid_length_m: 0.15
    # 좌/우 흰선에서 각각 복원한 중앙선이 이 이상 어긋나면 그 쌍을
    # 통째로 버린다. 도로 폭(0.634 m)은 고정이라 정상이면 수 mm 다.
    # 실측에서 주행 중 좌우 간격이 0.634 -> 0.415 -> 0.063 으로 무너지며
    # 복원값이 0.570 m 씩 어긋났고, 그게 엉뚱한 전타를 만들었다.
    white_pair_max_disagree_m: 0.10

    bang:
      # 진입 임계 [m]. 차선검출 횡오차 잡음이 ~0.005 m 라 8 배 여유.
      enter_m: 0.04
      # 이탈 임계 [m]. enter 보다 작아야 한다 (아니면 기동이 선다).
      exit_m: 0.015
      # 상태 전환 최소 유지 [s]. 조향 하드웨어 600 deg/s 기준
      # 0->20 deg 에 33 ms 가 걸린다. 그보다 짧게 뒤집으면 서보가
      # 목표에 닿기 전에 명령이 바뀐다.
      min_hold_s: 0.06

    # ================================================================
    # 속도
    # ================================================================
    # 이 스택의 전제가 "느리게 가서 전타로 버틴다" 다. 올리지 않는다.
    v_straight: 0.45
    v_corner: 0.30
    v_avoid: 0.30

    # --- 차선 근거 상실 유예 ---
    # 중앙선도 흰선도 없을 때 곧바로 세우지 않는다. 0 도로 저속 전진하며
    # 차선이 다시 화각에 들어오기를 기다린다. 유예가 끝나야 정지한다.
    #
    # 유예 구간이 "마지막 조향 유지" 가 아니라 0 도인 이유: 근거가
    # 끊기는 시점은 대개 방금 크게 꺾은 직후다. 전타를 그대로 들고
    # 가면 v=0.25 로 2 초에 방위가 58 도 더 돈다.
    v_lost: 0.25
    lost_grace_s: 2.0

    require_permission: true    # 출발 신호 없이는 안 나간다
    # 빨강 -> 초록 "전이" 를 직접 봐야 출발한다.
    #
    # 레벨만 보면(= 지금 초록인가?) 이미 초록인 상태로 기동했을 때
    # 전이를 못 보고 그대로 나간다. 신호를 보고 출발했다고 할 수 없다.
    # false 를 한 번 받아야 armed 되고, 그 뒤의 상승엣지에서만 출발한다.
    # 한 번 출발하면 래치된다 -- 출발 신호는 출발 조건이지 주행 중
    # 게이트가 아니다.
    #
    # 디버깅용으로 신호를 무시하려면 require_permission 을 false 로 둔다.
    # 이 값만 false 로 두면 "지금 초록이면 즉시 출발" 이 된다.
    require_red_to_green: true

    # ================================================================
    # 장애물 회피 (하드코딩 타이머 시퀀스)
    # ================================================================
    # 기하 근거는 avoid_fsm.hpp 상단 주석에 다 있다. 요약:
    #   횡변위 = d^2/(2R). 5 도(R=2.06)로 1 초(d=0.3)면 2.2 cm 라
    #   콘(반경 0.09)을 못 비킨다. 전타 S 자여야 한다.
    #   dodge_s = counter_s 로 두어야 방위가 0 으로 돌아온다.
    #
    # ★ dodge_s / counter_s 는 v_avoid 에 묶여 있다.
    #   목표 횡변위 0.20 m 기준: theta = 0.640 rad, L = R*theta = 0.316 m
    #   dodge_s = L / v_avoid = 0.316 / 0.30 = 1.05
    #   v_avoid 를 바꾸면 이 둘을 반드시 같이 바꾼다.
    avoid:
      trigger_x_min_m: 0.15
      trigger_x_max_m: 0.90     # S 자 종방향 0.59 m 보다 커야 한다
      trigger_y_abs_m: 0.20     # 콘 0.09 + 차 반폭 0.1025
      dodge_deg: 20.0
      dodge_s: 1.05
      counter_s: 1.05
      hold_s: 1.00              # 0 도 직진으로 장애물을 지나친다


simple_control:
  ros__parameters:

    steer_cmd_topic: "/simple/cmd_steer_deg"
    speed_cmd_topic: "/simple/cmd_speed"
    steer_topic: "/steering"    # [rad] 플랫폼 계약
    speed_topic: "/speed"       # [m/s]

    control_hz: 50.0
    cmd_timeout_s: 0.3          # 판단이 끊기면 조향 0 / 속도 0

    max_steer_deg: 20.0         # 하드웨어 한계
    # 하드웨어 600 deg/s. 밴뱅은 전타 전환이 빨라야 의미가 있어
    # Pure Pursuit 설정(300)보다 높게 잡는다. 서보가 못 따라가면
    # 낮춘다 -- 낮추면 실효 조향각이 지시보다 작아진다.
    max_steer_rate_deg_s: 600.0

    v_max: 0.60                 # 판단이 뭘 주든 이 위로는 안 나간다
    a_accel: 1.5
    a_decel: 1.5

    shutdown_zero_count: 5
    shutdown_zero_interval_ms: 20
