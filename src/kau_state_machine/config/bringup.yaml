# 기동 manifest. docs/01 section 8 · docs/08 section 3-1
#
# 현 구현 범위는 순차 spawn 뿐이다. 관문·재시도·evidence 는 미구현.
#
# 노드 필드
#   name         ROS 노드명. `-r __node:=` 로 강제
#   package      ament 패키지
#   executable   lib/<package>/<executable> 을 직접 실행 (ros2 run/launch 미사용)
#   ros          false 면 --ros-args 를 붙이지 않는다 (ROS 노드가 아닌 프로세스)
#   param_files  "pkg:share상대경로". **값이 아니라 위치만** 적는다
#   params       -p key:=value. 값이 @pkg:경로 면 절대경로로 치환
#                use_sim_time 은 여기 적지 않는다. launch 인자로 전 노드에
#                일괄 주입된다 (docs/01 section 10: 시각 소스 일치)
#   remap        -r from:=to
#   args         --ros-args 앞에 붙는 인자
#   wait         true 면 **관문**. 이 프로세스가 끝날 때까지 다음으로 안 넘어가고,
#                종료 코드가 0 이 아니면 기동을 중단한다
#   when         always(기본) · sim · real. 시계 소스로만 가른다
#
# 단계 필드
#   id           단계 번호 (로그 표시용)
#   delay_sec    이 단계 spawn 후 다음 단계까지 대기
#   nodes        동시 spawn 대상

run:
  # docs/09 는 /var/log/kau 지만 root 권한이 필요해 홈으로 둔다.
  log_dir: ~/.ros/kau/{run_id}

stages:

  # 단계 0 · sim 시계 문지기 (sim 전용)
  #
  # robot_localization 은 initialize() 에서 시계가 흐를 때까지 **타임아웃 없이**
  # 기다린다. spin() 앞이라 걸리면 로그 한 줄 없이 통째로 멈춘다. 맵 리로드
  # 직후 gz 가 paused 로 떠 있는 창에 기동을 치면 그렇게 된다.
  # 자세한 근거는 kau_localization/launch/clock_gate.py 주석.
  #
  # 시계가 흐르면 0 으로 빠지고, 180 초 안에 안 흐르면 1 로 빠져 기동을 접는다.
  # 조용히 멈춰 있는 것보다 낫다.
  - id: 0
    nodes:
      - name: clock_gate
        package: kau_localization
        executable: clock_gate.py
        ros: false
        wait: true
        when: sim
        args: [180.0]

  # 단계 1 · 플랫폼 EKF 재우기
  #
  # 차량 제공 EKF 와 우리 EKF 가 동시에 odom->base_footprint 를 쏘면 TF 가 깨진다.
  # 감시자가 SIGSTOP 으로 재워 두고 1 Hz 로 다시 확인한다 -- 플랫폼 launch 가
  # respawn=True 라 맵 리로드 때 새 PID 로 되살아나기 때문이다.
  #
  # ros: false 라 --ros-args 를 안 붙인다. use_sim_time 도 주입되지 않는데,
  # 감시자는 sim 시계가 아니라 monotonic 벽시계로 판정하므로 의도된 것이다
  # (시계가 얼어붙는 것 자체가 잡으려는 고장이다).
  - id: 1
    delay_sec: 1.0
    nodes:
      - name: platform_ekf_pause
        package: kau_localization
        executable: platform_ekf_pause.py
        ros: false
        args:
          - physicar_bringup/config/ekf_params.yaml
          - "@kau_localization:config/ekf.yaml"

  # 단계 2 · odom -> base_footprint
  - id: 2
    delay_sec: 2.0
    nodes:
      - name: kau_ekf
        package: robot_localization
        executable: ekf_node
        param_files: ["kau_localization:config/ekf.yaml"]
        remap: { odometry/filtered: /odom }

  # 단계 3 · map -> odom
  #
  # map_amcl_lifecycle_manager 가 autostart: true 로 map_server 와 amcl 을
  # configure/activate 한다. 우리가 Lifecycle 전이를 호출하지 않는다.
  - id: 3
    delay_sec: 3.0
    nodes:
      - name: map_server
        package: nav2_map_server
        executable: map_server
        param_files: ["kau_localization:config/amcl.yaml"]
        params:
          yaml_filename: "@kau_localization:maps/kau_v3.yaml"

      - name: amcl
        package: nav2_amcl
        executable: amcl
        param_files: ["kau_localization:config/amcl.yaml"]
        params:
          scan_topic: /scan
          # 초기 위치를 안 주면 amcl 은 map -> odom 을 아예 안 낸다
          # ("cannot publish a pose ... Please set the initial pose"). 그러면
          # map 프레임 자체가 없어서 local_planner 까지 같이 선다.
          # 값은 amcl.launch.py 사용 예의 start_pose:="0.23,-0.02,0.0" 과 같다.
          # 다른 자리에서 출발하면 여기를 고치거나 RViz 로 /initialpose 를 찍는다.
          set_initial_pose: true
          initial_pose.x: 0.23
          initial_pose.y: -0.02
          initial_pose.yaw: 0.0

      - name: map_amcl_lifecycle_manager
        package: nav2_lifecycle_manager
        executable: lifecycle_manager
        param_files: ["kau_localization:config/amcl.yaml"]

  # 단계 4 · 인지. 상호 무관하므로 동시
  - id: 4
    delay_sec: 3.0
    nodes:
      - name: laser_scan_validator
        package: kau_object_detection
        executable: laser_scan_validator_node
        param_files: ["kau_object_detection:config/laser_scan_validator.yaml"]

      - name: laser_scan_clusterer
        package: kau_object_detection
        executable: laser_scan_clusterer_node
        param_files:
          - "kau_object_detection:config/laser_scan_clusterer.yaml"
          - "kau_object_detection:config/amet_2026_track.yaml"

      # input_topic·output_topic 은 노드 기본값이 이미 맞아 지정하지 않는다.
      - name: start_signal_detector
        package: kau_object_detection
        executable: start_signal_detector_node
        param_files: ["kau_object_detection:config/start_signal_detector.yaml"]

      # pan_search_enable 은 lane_detection.yaml 이 이미 true 다.
      - name: kau_lane_detection_node
        package: kau_lane_detection
        executable: kau_lane_detection_node
        param_files: ["kau_lane_detection:config/lane_detection.yaml"]

  # 단계 5 · 전역 경로
  - id: 5
    delay_sec: 2.0
    nodes:
      - name: global_path_publisher
        package: kau_global_path
        executable: global_path_publisher.py
        params:
          path: "@kau_global_path:config/lane_graph.yaml"

      - name: global_avoidance_publisher
        package: kau_global_path
        executable: global_avoidance_publisher.py
        param_files: ["kau_global_path:config/global_avoidance.yaml"]

  # 단계 6 · 지역 경로. global path + 인지 입력이 있어야 한다
  - id: 6
    delay_sec: 2.0
    nodes:
      - name: local_planner_node
        package: kau_local_path_planner
        executable: local_planner_node
        param_files: ["kau_local_path_planner:config/local_planner.yaml"]
        params:
          track_yaml_path: "@kau_object_detection:config/amet_2026_track.yaml"

  # 단계 7 · 상태 머신
  #
  # mission_profile.yaml 은 아직 주석뿐이라 param_files 에 넣지 않는다.
  - id: 7
    delay_sec: 1.0
    nodes:
      - name: state_machine
        package: kau_state_machine
        executable: state_machine

  # 단계 8 · 조향. 구동보다 먼저 연다 (01 section 4-2)
  - id: 8
    delay_sec: 1.0
    nodes:
      - name: steer_controller
        package: kau_control
        executable: steer_controller_node
        param_files: ["kau_control:config/steer_controller.yaml"]

  # 단계 9 · 구동. 마지막에 연다
  - id: 9
    delay_sec: 1.0        # 마지막 단계의 생존 확인 정착 시간
    nodes:
      - name: speed_controller
        package: kau_control
        executable: speed_controller_node
        param_files: ["kau_control:config/speed_controller.yaml"]
